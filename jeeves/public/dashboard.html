<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280, initial-scale=1.0" />
  <title>Kitchen Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0f0f0f;
      --surface:      #1a1a1a;
      --surface2:     #222222;
      --border:       #2e2e2e;
      --text:         #f0f0f0;
      --muted:        #aaaaaa;
      --accent:       #4fc3f7;
      --alert-bg:     #1a0a00;
      --alert-col:    #ff6b35;
      --alert-bdr:    #ff6b35;
      --warn-bg:      #1a1500;
      --warn-col:     #f0c040;
      --warn-bdr:     #f0c040;
      --good:         #4caf50;
      --error-col:    #e53935;
      --radius:       12px;
      --radius-sm:    8px;
      --dim:          1;
    }

    /* Night-dim and idle-dim are two independent reasons to dim, but they
       share one visual state — nothing distinguishes "it's late" from
       "nobody's touched it in a while" on screen. */
    body.dimmed { --dim: 0.45; }
    #root { opacity: var(--dim); transition: opacity 2s ease; }

    html, body {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #root {
      display: grid;
      grid-template-rows: 1fr 50px;
      height: 800px;
    }

    /* ── Views ───────────────────────────────────────────────────── */
    #main { overflow: hidden; }
    #view-calendar { display: none; overflow: hidden; }

    /* ── Status panel ────────────────────────────────────────────── */
    /* height:100% + fr-sized rows so however many rows end up on a page,
       they share the full main area instead of leaving dead space above
       the footer when there are fewer than a full page of tiles. */
    #status-panel {
      height: 100%;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      grid-auto-rows: minmax(130px, 1fr);
      gap: 10px;
    }

    /* ── Tiles ───────────────────────────────────────────────────── */
    .tile {
      background: var(--surface);
      border: 1px solid #424242;
      border-radius: var(--radius);
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.3s, background 0.3s;
      position: relative;
      overflow: hidden;
    }

    .tile-header { display: flex; align-items: center; gap: 7px; }
    .tile-icon { font-size: 20px; line-height: 1; }

    .tile-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .tile-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-top: 4px;
    }

    .tile-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tile.alert { background: var(--alert-bg); border-color: var(--alert-bdr); animation: pulse-red 1.8s ease-in-out infinite; }
    .tile.alert .tile-value { color: var(--alert-col); }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0); }
      50%       { box-shadow: 0 0 0 6px rgba(255,107,53,0.25); }
    }

    .tile.degraded { background: var(--warn-bg); border-color: var(--warn-bdr); animation: pulse-yellow 2.4s ease-in-out infinite; }
    .tile.degraded .tile-value { color: var(--warn-col); }

    @keyframes pulse-yellow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(240,192,64,0); }
      50%       { box-shadow: 0 0 0 6px rgba(240,192,64,0.2); }
    }

    .tile.done { background: #0a1a0a; border-color: var(--good); cursor: pointer; }
    .tile.done .tile-value { color: var(--good); }

    .tile.chore-tile { background: #001c2e; border-color: var(--accent); cursor: pointer; }
    .tile.chore-tile .tile-value { color: var(--accent); font-size: 16px; }
    .tile.chore-tile:active { transform: scale(0.97); }

    /* ── Scoreboard tile ─────────────────────────────────────────── */
    .scoreboard-rows { display: flex; flex-direction: column; justify-content: space-evenly; flex: 1; margin-top: 6px; }
    .sb-row { display: flex; justify-content: space-between; align-items: center; padding: 1px 0; }
    .sb-name { font-size: 12px; color: var(--text); font-weight: 500; }
    .sb-count { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 20px; text-align: right; }
    .sb-count-pos { color: var(--good); }
    .sb-count-zero { color: var(--muted); }

    /* ── Batteries tile ──────────────────────────────────────────── */
    .battery-rows { display: flex; flex-direction: column; justify-content: space-evenly; flex: 1; margin-top: 6px; }
    .bat-row { display: flex; justify-content: space-between; align-items: center; padding: 1px 0; }
    .bat-name { font-size: 12px; color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bat-pct { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .bat-pct.charging { color: var(--accent); }
    .bat-pct.good { color: var(--good); }
    .bat-pct.warn { color: var(--warn-col); }
    .bat-pct.bad  { color: var(--alert-col); }

    /* ── PIN overlay ─────────────────────────────────────────────── */
    #pin-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    #pin-overlay.hidden { display: none; }
    .pin-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px 24px;
      width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    #pin-title { font-size: 15px; color: var(--muted); text-align: center; line-height: 1.4; }
    #pin-result {
      font-size: 22px;
      font-weight: 700;
      color: var(--good);
      text-align: center;
      display: none;
      line-height: 1.3;
    }
    .pin-dots { display: flex; gap: 18px; }
    .pin-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      transition: background 0.12s, border-color 0.12s, transform 0.12s;
    }
    .pin-dot.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.2); }
    .pin-dot.wrong  { background: var(--alert-col); border-color: var(--alert-col); }
    .pin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }
    .pin-key {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 1.6em;
      font-weight: 600;
      font-family: inherit;
      padding: 18px 0;
      cursor: pointer;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.08s, opacity 0.08s;
    }
    .pin-key:active { transform: scale(0.92); opacity: 0.7; }
    .pin-key-skip { font-size: 1em; font-weight: 400; color: var(--muted); }

    @keyframes float-up {
      0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(-280px) rotate(540deg) scale(0.6); opacity: 0; }
    }
    .celebrate-emoji {
      position: fixed;
      font-size: 2em;
      pointer-events: none;
      z-index: 300;
      animation: float-up 1.6s ease-out forwards;
    }

    /* ── Weather tiles ───────────────────────────────────────────── */
    .tile.weather-current-tile .tile-value { font-size: 30px; letter-spacing: -0.5px; }

    .forecast-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      margin-top: 6px;
    }

    .forecast-row { display: flex; align-items: center; gap: 9px; }

    .forecast-day {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      width: 26px;
    }

    .forecast-icon { font-size: 15px; line-height: 1; }
    .forecast-hl { font-size: 11px; color: var(--muted); }
    .forecast-hl strong { color: var(--text); }

    /* ── Up Next tile ─────────────────────────────────────────────── */
    .upnext-rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      margin-top: 6px;
    }
    .upnext-row { display: flex; align-items: center; gap: 9px; }
    .upnext-time {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      width: 48px;
      flex-shrink: 0;
    }
    .upnext-title {
      font-size: 12px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Calendar view ───────────────────────────────────────────── */
    #calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      height: 100%;
      overflow: hidden;
    }

    .cal-col {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .cal-col:last-child { border-right: none; }

    .cal-header {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .cal-col.today .cal-header { background: #0d2a38; border-bottom-color: var(--accent); }

    .cal-day-name {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }

    .cal-col.today .cal-day-name { color: var(--accent); }

    .cal-day-num {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }

    .cal-col.today .cal-day-num { color: var(--accent); }

    .cal-events {
      flex: 1;
      overflow: hidden;
      padding: 5px 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cal-event {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      overflow: hidden;
    }

    .cal-event-time {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
      white-space: nowrap;
    }

    .cal-event-title {
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    /* ── Alert strip ─────────────────────────────────────────────── */
    #alert-strip {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    #alert-strip.has-alerts { background: #1a0800; border-top-color: var(--alert-bdr); }
    #alert-strip.error      { background: #1a0000; border-top-color: var(--error-col); }
    #alert-strip.stale      { background: #1a1500; border-top-color: var(--warn-bdr); }

    #alert-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--alert-col);
      white-space: nowrap;
      border: 1px solid var(--alert-col);
      padding: 2px 8px;
      border-radius: 4px;
      display: none;
    }

    #alert-strip.has-alerts #alert-badge { display: block; }
    #alert-strip.error #alert-badge { display: block; color: var(--error-col); border-color: var(--error-col); }
    #alert-strip.stale #alert-badge { display: block; color: var(--warn-col); border-color: var(--warn-col); }

    #alert-ticker-wrap {
      flex: 1;
      overflow: hidden;
      height: 100%;
      display: flex;
      align-items: center;
    }

    #alert-ticker { font-size: 14px; color: var(--muted); white-space: nowrap; }
    #alert-strip.has-alerts #alert-ticker { color: #ffb380; }
    #alert-strip.error      #alert-ticker { color: #ff8a80; }
    #alert-strip.stale      #alert-ticker { color: var(--warn-col); }

    @keyframes ticker-fade {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Pool view ───────────────────────────────────────────────── */
    #view-pool {
      display: none;              /* shown as `grid` by showPoolView() */
      padding: 12px 16px;
      grid-template-rows: 124px 76px 1fr 76px;
      gap: 10px;
      height: 100%;
      overflow: hidden;
    }

    #pool-hero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

    .pool-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden;
    }
    .pool-card-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
    .pool-card-value { font-size: 29px; font-weight: 700; line-height: 1; }
    .pool-card-sub   { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pool-card.good .pool-card-value { color: var(--good); }
    .pool-card.warn { border-color: var(--warn-bdr); background: var(--warn-bg); }
    .pool-card.warn .pool-card-value { color: var(--warn-col); }
    .pool-card.bad  { border-color: var(--error-col); background: #1a0000; }
    .pool-card.bad  .pool-card-value { color: var(--error-col); font-size: 25px; }

    /* Schedule timeline — every pool alert is window-scoped, so "where are we
       in the day" is what makes the rest of the page interpretable. */
    #pool-timeline {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 9px 14px;
    }
    #pool-tl-track { position: relative; height: 18px; background: #232323; border-radius: 5px; }
    .tl-band { position: absolute; top: 0; bottom: 0; }
    .tl-band.pump  { background: #1d3a4a; }
    .tl-band.peak  { background: #3a2410; }
    .tl-band.sweep { background: #2f5f7e; }
    #pool-tl-now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); border-radius: 1px; }
    #pool-tl-axis, #pool-tl-legend { display: flex; font-size: 10px; color: var(--muted); margin-top: 5px; }
    #pool-tl-axis { justify-content: space-between; }
    #pool-tl-legend { gap: 16px; }
    .tl-key { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

    #pool-mid { display: grid; grid-template-columns: 1fr 292px; gap: 10px; overflow: hidden; }

    .pool-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 9px 14px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .pool-panel-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted); flex-shrink: 0; margin-bottom: 4px;
    }

    /* Two stacked single-series charts sharing a time axis — NOT one chart with
       two y-scales. Water temp (~78-86 F) and dT (~0-3 F) are different scales;
       overlaying them on a dual axis is the classic misleading-chart mistake. */
    #pool-charts { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
    .chart-block { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .chart-head  { display: flex; justify-content: space-between; align-items: baseline; flex-shrink: 0; }
    .chart-name  { font-size: 12px; color: var(--text); }
    .chart-now   { font-size: 13px; font-weight: 700; }
    .chart-svg   { width: 100%; flex: 1; min-height: 0; }
    .chart-foot  { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); flex-shrink: 0; }
    .chart-empty { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); text-align: center; }

    /* Hour gridlines and the now-marker, matching the timeline strip above.
       Drawn in SVG (lines survive preserveAspectRatio="none"); the hour LABELS
       are HTML, because text in a non-uniformly scaled SVG gets stretched. */
    .chart-grid  { stroke: #262626; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .chart-grid.day { stroke: #333; }
    .chart-nowln { stroke: var(--text); stroke-width: 1; opacity: .55;
                   stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
    /* One axis under both charts — they share a frame, so they share the axis. */
    #pool-chart-axis {
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--muted); flex-shrink: 0; margin-top: 2px;
    }

    .pool-read { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; padding: 5px 0; border-bottom: 1px solid #242424; }
    .pool-read:last-child { border-bottom: none; }
    .pool-read-k { color: var(--muted); }
    .pool-read-v { font-weight: 600; }
    .pool-read-v.muted { color: var(--muted); font-weight: 400; font-size: 11px; }
    .pool-read-v.bad   { color: var(--error-col); }

    #pool-foot {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0 16px;
      display: flex; align-items: center; gap: 16px;
    }
    #pool-foot.has-alerts { border-color: var(--alert-bdr); background: #1a0800; }
    #pool-foot-next { flex: 1; overflow: hidden; }
    #pool-foot-next .fn-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
    #pool-foot-next .fn-body  { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #pool-foot-alerts { font-size: 13px; white-space: nowrap; }

    .pool-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      font-size: 13px; padding: 9px 15px; border-radius: var(--radius-sm); cursor: pointer;
    }
    .pool-btn:active { transform: scale(0.97); }

    /* ── Alert overlay ───────────────────────────────────────────── */
    /* Outside #root on purpose, so it stays full brightness during the
       10pm-6am night dim — you only open it because something is wrong. */
    #alert-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72);
      display: none; align-items: center; justify-content: center; z-index: 120;
    }
    #alert-overlay.open { display: flex; }

    #alert-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); width: 840px; max-height: 640px;
      display: flex; flex-direction: column;
    }
    #alert-panel-head {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    #alert-panel-title { font-size: 15px; font-weight: 600; }
    #alert-panel-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }
    #alert-list { overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }

    .al-row {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 12px 14px; display: grid; grid-template-columns: 46px 1fr auto;
      gap: 13px; align-items: center;
    }
    .al-row.l1 { border-color: var(--error-col); background: #1a0000; }
    .al-row.l2 { border-color: var(--alert-bdr);  background: var(--alert-bg); }
    .al-row.l3 { border-color: var(--warn-bdr);   background: var(--warn-bg); }
    .al-chip { font-size: 12px; font-weight: 700; text-align: center; padding: 4px 0; border-radius: 4px; border: 1px solid currentColor; }
    .al-row.l1 .al-chip { color: var(--error-col); }
    .al-row.l2 .al-chip { color: var(--alert-col); }
    .al-row.l3 .al-chip { color: var(--warn-col); }
    .al-title  { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .al-meta   { font-size: 12px; color: var(--muted); }
    .al-cond          { font-weight: 700; }
    .al-cond.active   { color: var(--alert-col); }
    .al-cond.cleared  { color: var(--good); }
    .al-action { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .al-ack {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      font-size: 13px; padding: 10px 15px; border-radius: var(--radius-sm);
      cursor: pointer; white-space: nowrap;
    }
    .al-ack.armed { background: var(--error-col); border-color: var(--error-col); color: #fff; font-weight: 600; }
    .al-ack:active { transform: scale(0.97); }
    #alert-empty { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }

    /* ── Page dots ───────────────────────────────────────────────── */
    #page-dots { display: flex; gap: 7px; align-items: center; }
    .page-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background 0.3s; }
    .page-dot.active { background: var(--accent); }

    #last-updated { font-size: 12px; color: var(--muted); white-space: nowrap; }

    #refresh-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--good);
      flex-shrink: 0;
      opacity: 0.5;
      transition: background 0.4s, opacity 0.3s;
    }
    #refresh-dot.flash { opacity: 1; }
    #refresh-dot.error { background: var(--error-col); opacity: 1; }
    #refresh-dot.stale { background: var(--warn-col); opacity: 1; }

    /* ── Mic button ──────────────────────────────────────────────── */
    #mic-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      user-select: none;
    }
    #mic-btn.listening  { background: #3a0000; color: #ff5555; border-color: #ff5555; }
    #mic-btn.processing { color: var(--accent); border-color: var(--accent); }
    #mic-btn.playing    { background: #003a00; color: var(--good); border-color: var(--good); }

    /* ── Chat button ─────────────────────────────────────────────── */
    #chat-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      user-select: none;
    }
    #chat-btn.open { background: #001a2a; color: var(--accent); border-color: var(--accent); }

    /* ── Chat overlay ────────────────────────────────────────────── */
    #chat-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #chat-overlay.open { display: flex; }

    #chat-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 700px;
      height: 560px;
      display: flex;
      flex-direction: column;
    }

    #chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    #chat-title { font-size: 14px; font-weight: 600; color: var(--text); }

    #chat-close {
      background: none; border: none;
      color: var(--muted); font-size: 18px;
      cursor: pointer; padding: 0 4px; line-height: 1;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-msg {
      max-width: 82%;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msg.user      { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 3px; }
    .chat-msg.assistant { align-self: flex-start; background: var(--surface2); color: var(--text); border-bottom-left-radius: 3px; }
    .chat-msg.thinking  { align-self: flex-start; background: var(--surface2); color: var(--muted); font-style: italic; border-bottom-left-radius: 3px; }

    #chat-input-row {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    #chat-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      padding: 9px 13px;
      outline: none;
      font-family: inherit;
    }
    #chat-input:focus { border-color: var(--accent); }
    #chat-input::placeholder { color: var(--muted); }

    #chat-send {
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #000;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 18px;
      cursor: pointer;
    }
    #chat-send:disabled { opacity: 0.4; cursor: default; }

    /* ── Chore button ────────────────────────────────────────────── */
    #chore-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      user-select: none;
    }
    #chore-btn.open { background: #001c2e; color: var(--accent); border-color: var(--accent); }

    /* ── Chore overlay ───────────────────────────────────────────── */
    #chore-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    #chore-overlay.hidden { display: none; }
    .chore-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chore-panel-title { font-size: 16px; font-weight: 600; color: var(--text); text-align: center; }
    .chore-presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .chore-preset {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      padding: 13px 10px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .chore-preset:active { background: #001c2e; border-color: var(--accent); }
    .chore-custom-row { display: flex; gap: 8px; }
    #chore-custom-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      font-family: inherit;
    }
    #chore-custom-input:focus { border-color: var(--accent); }
    #chore-custom-input::placeholder { color: var(--muted); }
    #chore-custom-add {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 16px;
      cursor: pointer;
      font-family: inherit;
    }
    #chore-cancel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 14px;
      font-family: inherit;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      width: 100%;
    }

    /* ── Library overlay ─────────────────────────────────────────── */
    #library-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    #library-overlay.open { display: flex; }
    .library-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 440px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .library-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .library-panel-title { font-size: 16px; font-weight: 600; color: var(--text); }
    #library-close {
      background: none; border: none;
      color: var(--muted); font-size: 18px;
      cursor: pointer; padding: 0 4px; line-height: 1;
    }
    #library-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .library-row {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .library-row-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .library-row-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .library-row.overdue { border-color: var(--alert-col); }
    .library-row.overdue .library-row-sub { color: var(--alert-col); }
    .library-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
<div id="root">

  <!-- Dashboard view -->
  <div id="main">
    <section id="status-panel"></section>
  </div>

  <!-- Calendar view -->
  <div id="view-calendar">
    <div id="calendar-grid"></div>
  </div>

  <!-- Pool view -->
  <div id="view-pool">
    <div id="pool-hero"></div>

    <div id="pool-timeline">
      <div id="pool-tl-track"></div>
      <div id="pool-tl-axis"></div>
      <div id="pool-tl-legend">
        <span><i class="tl-key" style="background:#1d3a4a"></i>Main pump 9pm–4pm</span>
        <span><i class="tl-key" style="background:#3a2410"></i>Peak rate 4–9pm</span>
        <span><i class="tl-key" style="background:#2f5f7e"></i>Sweep 9:45–11:15pm</span>
      </div>
    </div>

    <div id="pool-mid">
      <div class="pool-panel">
        <div class="pool-panel-title">Last 24 hours</div>
        <div id="pool-charts"></div>
      </div>
      <div class="pool-panel">
        <div class="pool-panel-title">Pad node</div>
        <div id="pool-reads"></div>
      </div>
    </div>

    <div id="pool-foot">
      <div id="pool-foot-next"></div>
      <div id="pool-foot-alerts"></div>
      <button class="pool-btn" id="pool-alerts-btn">Manage alerts</button>
      <button class="pool-btn" id="pool-back-btn">Back</button>

  </div>

  <footer id="alert-strip">
    <span id="alert-badge">Alert</span>
    <div id="alert-ticker-wrap">
      <span id="alert-ticker">All systems normal</span>
    </div>
    <div id="page-dots"></div>
    <span id="last-updated"></span>
    <div id="refresh-dot"></div>
    <div id="mic-btn" title="Tap to speak">🎤</div>
    <div id="chat-btn" title="Ask Jeeves">💬</div>
    <div id="chore-btn" title="Add Chore">📋</div>
  </footer>

</div>

<div id="alert-overlay">
  <div id="alert-panel">
    <div id="alert-panel-head">
      <div id="alert-panel-title">Open alerts</div>
      <button id="alert-panel-close">✕</button>
    </div>
    <div id="alert-list"></div>
  </div>
</div>

<div id="chat-overlay">
  <div id="chat-panel">
    <div id="chat-header">
      <span id="chat-title">💬 Ask Jeeves</span>
      <button id="chat-close">✕</button>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input id="chat-input" type="text" placeholder="Ask anything…" autocomplete="off" />
      <button id="chat-send">Send</button>
    </div>
  </div>
</div>

<div id="pin-overlay" class="hidden">
  <div class="pin-panel">
    <div id="pin-title">Who unloaded it?</div>
    <div id="pin-result"></div>
    <div class="pin-dots">
      <span class="pin-dot" id="pd0"></span>
      <span class="pin-dot" id="pd1"></span>
      <span class="pin-dot" id="pd2"></span>
      <span class="pin-dot" id="pd3"></span>
    </div>
    <div class="pin-grid" id="pin-grid">
      <button class="pin-key" data-val="1">1</button>
      <button class="pin-key" data-val="2">2</button>
      <button class="pin-key" data-val="3">3</button>

      <button class="pin-key" data-val="5">5</button>
      <button class="pin-key" data-val="6">6</button>

<div id="chore-overlay" class="hidden">
  <div class="chore-panel">
    <div class="chore-panel-title">Add a Chore</div>
    <div class="chore-presets" id="chore-presets">
      <!-- populated dynamically from /api/chores/presets (jeeves/chores.json) -->
    </div>
    <div class="chore-custom-row">
      <input id="chore-custom-input" type="text" placeholder="Custom chore…" autocomplete="off" />
      <button id="chore-custom-add">Add</button>
