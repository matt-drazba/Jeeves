</div>

<div id="library-overlay">
  <div class="library-panel">
    <div class="library-panel-header">
      <div class="library-panel-title" id="library-panel-title-text">Ready for Pickup</div>
      <button id="library-close">✕</button>
    </div>
    <div id="library-list"></div>
  </div>
</div>

<script>
  /* ── View switching ─────────────────────────────────────────────── */
  // Calendar is no longer part of the auto-rotation — it's opened by
  // tapping the "Today" tile and auto-returns after a short timeout.
  let _onCalendar = false;
  let _onPool     = false;
  let _calendarReturnTimer = null;
  let _poolReturnTimer     = null;

  function showDashboardView() {
    _onCalendar = false;
    _onPool     = false;
    clearTimeout(_calendarReturnTimer);
    clearTimeout(_poolReturnTimer);
    document.getElementById('main').style.display          = '';
    document.getElementById('view-calendar').style.display = 'none';
    document.getElementById('view-pool').style.display     = 'none';
  }

  function showCalendarView() {
    _onCalendar = true;
    _onPool     = false;
    clearTimeout(_poolReturnTimer);
    document.getElementById('main').style.display          = 'none';
    document.getElementById('view-pool').style.display     = 'none';
    document.getElementById('view-calendar').style.display = 'block';
    clearTimeout(_calendarReturnTimer);
    _calendarReturnTimer = setTimeout(showDashboardView, 20_000);
  }

  function showPoolView() {
    _onPool     = true;
    _onCalendar = false;
    clearTimeout(_calendarReturnTimer);
    document.getElementById('main').style.display          = 'none';
    document.getElementById('view-calendar').style.display = 'none';
    document.getElementById('view-pool').style.display     = 'grid';
    if (_lastData) renderPool(_lastData);
    renderPoolTimeline();
    loadPoolHistory();
    bumpPoolTimer();
  }

  // 60s rather than the calendar's 20s — this is a page you read and act on,
  // and every tap inside it starts the clock over.
  function bumpPoolTimer() {
    clearTimeout(_poolReturnTimer);
    _poolReturnTimer = setTimeout(() => {
      // Don't yank the page out from under an open alert overlay.
      if (document.getElementById('alert-overlay').classList.contains('open')) {
        bumpPoolTimer();
        return;
      }
      showDashboardView();
    }, 60_000);
  }

  document.getElementById('view-calendar').addEventListener('click', showDashboardView);
  document.getElementById('view-pool').addEventListener('click', bumpPoolTimer);

  /* ── Data fetch ─────────────────────────────────────────────────── */
  let _lastData = null;

  async function fetchData() {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    _lastData = await res.json();
    return _lastData;
  }

  /* ── Weather icons ──────────────────────────────────────────────── */
  function weatherIcon(condition) {
    const c = (condition || '').toLowerCase();
    if (c.includes('sun') || c.includes('clear'))     return '☀️';
    if (c.includes('cloud'))                           return '⛅';
    if (c.includes('rain') || c.includes('shower'))   return '🌧️';
    if (c.includes('snow'))                            return '❄️';
    if (c.includes('storm') || c.includes('thunder')) return '⛈️';
    if (c.includes('fog')  || c.includes('mist'))     return '🌫️';
    if (c.includes('wind'))                            return '💨';
    return '🌤️';
  }

  /* ── Weather tile ───────────────────────────────────────────────── */
  let _weatherData = null;

  function renderWeather(w) {
    _weatherData = w;
    _patchWeatherTile();
  }

  function _patchWeatherTile() {
    const w = _weatherData;
    if (!w) return;
    const icon = document.getElementById('wt-icon');
    if (!icon) return; // weather tiles not in DOM on this page
    icon.textContent = weatherIcon(w.condition);
    document.getElementById('wt-temp').textContent = w.temp + '°';
    document.getElementById('wt-sub').textContent = `${w.condition} · H ${w.high}° / L ${w.low}°`;
    const fore = document.getElementById('wt-forecast');
    if (fore) {
      fore.innerHTML = (w.forecast || []).slice(0, 3).map(f => `
        <div class="forecast-row">
          <span class="forecast-day">${f.day}</span>
          <span class="forecast-icon">${weatherIcon(f.condition)}</span>
          <span class="forecast-hl"><strong>${f.high}</strong> / ${f.low}</span>
        </div>
      `).join('');
    }
  }

  /* ── Render status tiles ────────────────────────────────────────── */
  let _tilesBuilt     = false;
  let _fullRebuildCounter = 0;
  let _renderedPage   = -1;
  const FULL_REBUILD_EVERY = 30;
  // 22 status tiles + the 2 weather tiles = the 24 cells that actually fit
  // (6 cols x 4 rows at 1280x800). #main is overflow:hidden, so anything past
  // this silently clips rather than scrolling.
  const TILES_PER_PAGE     = 22;
  let _tilePage       = 0;
  let _totalTilePages = 1;

  function updatePageDots() {
    const dots = document.getElementById('page-dots');
    if (_totalTilePages <= 1) { dots.innerHTML = ''; return; }
    dots.innerHTML = Array.from({ length: _totalTilePages }, (_, i) =>
      `<span class="page-dot${i === _tilePage ? ' active' : ''}"></span>`
    ).join('');
  }

  function renderStatus(status) {
    const panel      = document.getElementById('status-panel');
    const allEntries = Object.entries(status);

    _totalTilePages = Math.max(1, Math.ceil(allEntries.length / TILES_PER_PAGE));
    if (_tilePage >= _totalTilePages) _tilePage = 0;
    updatePageDots();

    const pageStart   = _tilePage * TILES_PER_PAGE;
    const pageEntries = allEntries.slice(pageStart, pageStart + TILES_PER_PAGE);
    const showWeather = _tilePage === 0;

    // Detect key-set changes (chore tiles added/removed) to force a rebuild
    const panelKeys = new Set([...panel.querySelectorAll('[data-key]')].map(el => el.dataset.key));
    const entryKeys = new Set(pageEntries.map(([k]) => k));
    if (showWeather) { entryKeys.add('__weather'); entryKeys.add('__forecast'); }
    const keysChanged = panelKeys.size !== entryKeys.size || [...entryKeys].some(k => !panelKeys.has(k));

    _fullRebuildCounter++;
    const needsRebuild = !_tilesBuilt
      || _renderedPage !== _tilePage
      || _fullRebuildCounter >= FULL_REBUILD_EVERY
      || keysChanged;

    if (needsRebuild) {
      _fullRebuildCounter = 0;
      _tilesBuilt   = true;
      _renderedPage = _tilePage;

      let html = '';
      if (showWeather) {
        html += `<div class="tile weather-current-tile" data-key="__weather">
          <div class="tile-header">
            <span class="tile-icon" id="wt-icon">🌤️</span>
            <span class="tile-label">Weather</span>
          </div>
          <div id="wt-temp" class="tile-value">--°</div>
          <div id="wt-sub" class="tile-sub">--</div>
        </div>
        <div class="tile" data-key="__forecast">
          <div class="tile-header">
            <span class="tile-icon">📅</span>
            <span class="tile-label">Forecast</span>
          </div>
          <div class="forecast-body" id="wt-forecast"></div>
        </div>`;
      }
      html += pageEntries.map(([key, tile]) => {
        if (key === 'upNext') {
          return `<div class="tile" data-key="${key}">
            <div class="tile-header">
              <span class="tile-icon">${tile.icon || '🗓️'}</span>
              <span class="tile-label">${tile.label}</span>
            </div>
            <div class="tile-value">${tile.value}</div>
            <div class="upnext-rows" id="upnext-rows"></div>
          </div>`;
        }
        if (key === 'scoreboard') {
          return `<div class="tile" data-key="${key}">
            <div class="tile-header">
              <span class="tile-icon">🏆</span>
              <span class="tile-label">Chores</span>
            </div>
            <div class="scoreboard-rows" id="scoreboard-rows"></div>
          </div>`;
        }
        if (key === 'batteries') {
          return `<div class="tile" data-key="${key}">
            <div class="tile-header">
              <span class="tile-icon">🔋</span>
              <span class="tile-label">Batteries</span>
            </div>
            <div class="battery-rows" id="battery-rows"></div>
          </div>`;
        }
        if (tile.isChore) {
          return `<div class="tile chore-tile" data-key="${key}" data-chore-id="${tile.choreId}">
            <div class="tile-header">
              <span class="tile-icon">${tile.icon || '🧹'}</span>
              <span class="tile-label">${tile.label}</span>
            </div>
            <div class="tile-value">Tap to claim!</div>
            <div class="tile-sub">Hold to remove</div>
          </div>`;
        }
        return `<div class="tile" data-key="${key}">
          <div class="tile-header">
            <span class="tile-icon">${tile.icon || '●'}</span>
            <span class="tile-label">${tile.label}</span>
          </div>
          <div class="tile-value">${tile.value}</div>
          <div class="tile-sub">${tile.sub || ''}</div>
        </div>`;
      }).join('');
      panel.innerHTML = html;

      if (showWeather) _patchWeatherTile();
    }

    for (const [key, tile] of pageEntries) {
      const el = panel.querySelector(`[data-key="${key}"]`);
      if (!el) continue;
      if (tile.isChore) continue; // chore tiles are static; class/value set at build time
      el.className = 'tile' + (tile.done ? ' done' : tile.alert ? ' alert' : tile.degraded ? ' degraded' : '');

      if (key === 'upNext') {
        el.querySelector('.tile-value').textContent = tile.value;
        const rows = el.querySelector('#upnext-rows');
        if (rows) {
          rows.innerHTML = (tile.events || [])
            .map(ev => `<div class="upnext-row"><span class="upnext-time">${ev.time}</span><span class="upnext-title">${ev.title}</span></div>`)
            .join('');
        }
        continue;
      }

      if (key === 'scoreboard') {
        const rows = el.querySelector('.scoreboard-rows');
        if (rows && tile.members?.length) {
          rows.innerHTML = tile.members.map(m =>
            `<div class="sb-row">
              <span class="sb-name">${m.name}</span>
              <span class="sb-count ${m.count > 0 ? 'sb-count-pos' : 'sb-count-zero'}">${m.count}</span>
            </div>`
          ).join('');
        }
        continue;
      }

      if (key === 'batteries') {
        renderBatteryRows(tile.devices || []);
        continue;
      }

      if (tile.color) {
        el.style.borderColor = tile.color;
        el.style.background  = tile.bg || '';
        el.querySelector('.tile-value').style.color = tile.color;
      } else {
        el.style.borderColor = '';
        el.style.background  = '';
        el.querySelector('.tile-value').style.color = '';
      }
      el.querySelector('.tile-value').textContent = tile.value;
      const subEl = el.querySelector('.tile-sub');
      if (subEl) subEl.textContent = tile.sub || '';
    }
  }

  /* ── Tile page cycling ──────────────────────────────────────────── */
  setInterval(() => {
    if (_onCalendar || _onPool || _totalTilePages <= 1) return;
    _tilePage = (_tilePage + 1) % _totalTilePages;
    if (_lastData) renderStatus(_lastData.status);
  }, 25_000);

  /* ── Render calendar ────────────────────────────────────────────── */
  function renderCalendar(calendar) {
    if (!calendar?.days?.length) return;
    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = calendar.days.map(day => `
      <div class="cal-col${day.isToday ? ' today' : ''}">
        <div class="cal-header">
          <div class="cal-day-name">${day.dayName}</div>
          <div class="cal-day-num">${day.dayNum}</div>
        </div>
        <div class="cal-events">
          ${day.events.map(ev => `
            <div class="cal-event">
              ${ev.allDay ? '' : `<div class="cal-event-time">${ev.time}</div>`}
              <div class="cal-event-title">${ev.title}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  /* ── Alert ticker ───────────────────────────────────────────────── */
  let _alertIndex = 0;
  let _alerts = [];
  let _prevAlertCount = 0;

  function renderAlerts(alerts) {
    _alerts = alerts || [];
    const strip  = document.getElementById('alert-strip');
    const ticker = document.getElementById('alert-ticker');
    const badge  = document.getElementById('alert-badge');

    if (_alerts.length !== _prevAlertCount) { _alertIndex = 0; _prevAlertCount = _alerts.length; }

    strip.classList.remove('has-alerts', 'error', 'stale');
    badge.textContent = 'Alert';

    if (_alerts.length === 0) { ticker.textContent = 'All systems normal'; return; }

    strip.classList.add('has-alerts');
    ticker.textContent = _alerts[_alertIndex] ?? _alerts[0];
  }

  function tickAlert() {
    if (_alerts.length === 0) return;
    _alertIndex = (_alertIndex + 1) % _alerts.length;
    const ticker = document.getElementById('alert-ticker');
    ticker.style.animation = 'none';
    ticker.offsetHeight;
    ticker.style.animation = 'ticker-fade 0.4s ease';
    ticker.textContent = _alerts[_alertIndex];
  }

  /* ── Battery tile (pinned rows + rotating rows) ───────────────────── */
  // Dusty and Snorlax are pinned — always rows 1-2, regardless of charge.
  // Everything else sorts worst-first (charging floats up too, since that's
  // active-state info) and a 2-wide window slides through it on the same
  // 5s beat as the alert ticker, advancing by one row per tick.
  const BATTERY_ROTATE_SIZE = 2;
  let _batteryDevices     = [];
  let _batteryRotateIndex = 0;

  function _batteryClass(d) {
    if (d.charging) return 'charging';
    if (d.pct < 20) return 'bad';
    if (d.pct < 50) return 'warn';
    return 'good';
  }

  function _batteryRowHtml(d) {
    const cls  = _batteryClass(d);
    const bolt = d.charging ? '⚡ ' : '';
    return `<div class="bat-row">
      <span class="bat-name">${d.icon || '🔋'} ${d.label}</span>
      <span class="bat-pct ${cls}">${bolt}${d.pct}%</span>
    </div>`;
  }

  function _sortedOthers() {
    return _batteryDevices
      .filter(d => !d.pinned)
      .sort((a, b) => (b.charging - a.charging) || (a.pct - b.pct));
  }

  function _paintBatteryRows() {
    const el = document.getElementById('battery-rows');
    if (!el) return;
    const pinned = _batteryDevices.filter(d => d.pinned);
    const others = _sortedOthers();
    const window = [];
    for (let i = 0; i < Math.min(BATTERY_ROTATE_SIZE, others.length); i++) {
      window.push(others[(_batteryRotateIndex + i) % others.length]);
    }
    el.innerHTML = pinned.map(_batteryRowHtml).join('') + window.map(_batteryRowHtml).join('');
  }

  function renderBatteryRows(devices) {
    _batteryDevices = devices;
    // A device set change (new device added/removed) shouldn't leave the
    // rotation pointing past the end of a now-shorter list.
    if (_batteryRotateIndex >= _sortedOthers().length) _batteryRotateIndex = 0;
    _paintBatteryRows();
  }

  function tickBatteries() {
    const others = _sortedOthers();
    if (others.length <= BATTERY_ROTATE_SIZE) return; // everything already fits, nothing to rotate
    _batteryRotateIndex = (_batteryRotateIndex + 1) % others.length;
    _paintBatteryRows();
  }

  function _batteryStaleSub(d) {
    if (!d.lastChanged) return '';
    const ageMs = Date.now() - new Date(d.lastChanged).getTime();
    const days  = Math.floor(ageMs / (24 * 3600 * 1000));
    return days >= 2 ? ` · as of ${days}d ago` : '';
  }

  function openBatteriesOverlay() {
    document.getElementById('library-panel-title-text').textContent = 'Batteries';
    const list = document.getElementById('library-list');
    const all  = [..._batteryDevices].sort((a, b) => (b.charging - a.charging) || (a.pct - b.pct));
    list.innerHTML = all.length
      ? all.map(d => {
          const cls = _batteryClass(d);
          const colorVar = cls === 'charging' ? 'var(--accent)' : cls === 'bad' ? 'var(--alert-col)' : cls === 'warn' ? 'var(--warn-col)' : 'var(--good)';
          return `<div class="library-row">
            <div class="library-row-title">${d.icon || '🔋'} ${d.label}${d.pinned ? ' 📌' : ''}</div>
            <div class="library-row-sub">
              <span style="color:${colorVar}; font-weight:600;">${d.pct}%${d.charging ? ' · Charging' : ''}</span>${_batteryStaleSub(d)}
            </div>
          </div>`;
        }).join('')
      : '<div class="library-empty">No battery data</div>';
    document.getElementById('library-overlay').classList.add('open');
  }

  /* ── Stale / error state ────────────────────────────────────────── */
  const REFRESH_INTERVAL_MS = 60_000;
  let _lastSuccessfulRefresh = null;

  function setDataState(state) {
    const strip  = document.getElementById('alert-strip');
    const dot    = document.getElementById('refresh-dot');
    const badge  = document.getElementById('alert-badge');
    const ticker = document.getElementById('alert-ticker');

    strip.classList.remove('has-alerts', 'error', 'stale');
    dot.classList.remove('flash', 'error', 'stale');

    if (state === 'error') {
      strip.classList.add('error'); dot.classList.add('error');
      badge.textContent = 'Error'; ticker.textContent = 'Data refresh failed — retrying…';
    } else if (state === 'stale') {
      strip.classList.add('stale'); dot.classList.add('stale');
      badge.textContent = 'Stale'; ticker.textContent = 'Data may be outdated — check connection';
    } else {
      dot.classList.add('flash');
      setTimeout(() => dot.classList.remove('flash'), 600);
    }
  }

  function checkStaleness() {
    if (!_lastSuccessfulRefresh) return;
    if (Date.now() - _lastSuccessfulRefresh > REFRESH_INTERVAL_MS * 2) setDataState('stale');
  }

  function updateTimestamp() {
    if (!_lastSuccessfulRefresh) return;
    const d = new Date(_lastSuccessfulRefresh);
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    const s = String(d.getSeconds()).padStart(2, '0');
    document.getElementById('last-updated').textContent = `Updated ${h}:${m}:${s}`;
  }

  /* ── Refresh ────────────────────────────────────────────────────── */
  async function refresh() {
    try {
      const data = await fetchData();
      _lastSuccessfulRefresh = Date.now();
      renderWeather(data.weather);
      renderStatus(data.status);
      renderAlerts(data.alerts);
      renderCalendar(data.calendar);
      if (_onPool) { renderPool(data); renderPoolTimeline(); }
      if (document.getElementById('alert-overlay').classList.contains('open')) {
        renderAlertOverlay(data.alertDetail || []);
      }
      updateTimestamp();
      setDataState('ok');
    } catch (err) {
      setDataState('error');
    }
  }

  /* ── Night dim + idle dim ───────────────────────────────────────── */
  // No on-screen clock or date — the tablet sits next to a physical clock
  // and calendar. Two independent triggers want the same dim look: it's
  // 10pm-6am, or nobody has touched the screen in a while.
  let _isNight       = false;
  let _isIdleDimmed  = false;
  let _idleTimer     = null;
  const IDLE_DIM_MS  = 120_000; // 2 min of no touches

  function updateDimState() {
    document.body.classList.toggle('dimmed', _isNight || _isIdleDimmed);
  }

  function updateNightDim() {
    const h = new Date().getHours();
    _isNight = h >= 22 || h < 6;
    updateDimState();
  }

  function armIdleTimer() {
    clearTimeout(_idleTimer);
    _idleTimer = setTimeout(() => {
      _isIdleDimmed = true;
      updateDimState();
    }, IDLE_DIM_MS);
  }

  // Every touch resets the idle clock. If the screen is currently idle-dimmed,
  // the touch that wakes it is swallowed here (capture phase, before it can
  // reach a tile's own pointerdown/click handler) so a half-asleep tap can't
  // also dismiss a chore or open an alert — it just wakes the screen. The
  // *next* tap behaves normally.
  document.addEventListener('pointerdown', (e) => {
    if (_isIdleDimmed) {
      _isIdleDimmed = false;
      updateDimState();
      e.preventDefault();
      e.stopImmediatePropagation();
    }
    armIdleTimer();
  }, true);

  /* ── Tap-to-dismiss with PIN overlay ───────────────────────────── */
  let _pendingKey = null, _pendingTile = null, _pinInput = '', _pendingType = null, _pendingChoreId = null;

  function _updateDots() {
    for (let i = 0; i < 4; i++) {
      const d = document.getElementById(`pd${i}`);
      d.className = 'pin-dot' + (_pinInput.length > i ? ' filled' : '');
    }
  }

  function _flashWrong() {
    for (let i = 0; i < 4; i++) document.getElementById(`pd${i}`).className = 'pin-dot wrong';
    setTimeout(() => { _pinInput = ''; _updateDots(); }, 600);
  }

  function _celebrate(name) {
    const emojis = ['🎉','🎊','🎈','⭐','🌟','✨','🥳','💫','🏆','🎯','🌈','💥'];
    const count = 22;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('span');
      el.className = 'celebrate-emoji';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left   = (10 + Math.random() * 80) + 'vw';
      el.style.top    = (30 + Math.random() * 45) + 'vh';
      el.style.fontSize = (1.4 + Math.random() * 1.8) + 'em';
      el.style.animationDelay    = (Math.random() * 0.4) + 's';
      el.style.animationDuration = (1.2 + Math.random() * 0.8) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2400);
    }

    const result = document.getElementById('pin-result');
    result.textContent = `Nice work, ${name}! 🎉`;
    result.style.display = 'block';
    document.getElementById('pin-grid').style.display = 'none';
    document.querySelector('.pin-dots').style.visibility = 'hidden';
  }

  function _closePinOverlay() {
    document.getElementById('pin-overlay').classList.add('hidden');
    document.getElementById('pin-result').style.display = 'none';
    document.getElementById('pin-grid').style.display = 'grid';
    document.querySelector('.pin-dots').style.visibility = 'visible';
    _pinInput = '';
  }

  async function _submitDismiss(pin) {
    const overlay = document.getElementById('pin-overlay');
    const tile = _pendingTile;
    const key  = _pendingKey;

    if (_pendingType === 'chore') {
      if (!pin) {
        // Skip: close overlay but leave the chore tile in place
        _closePinOverlay();
        return;
      }
      const res = await fetch(`/api/chores/${_pendingChoreId}/complete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin }),
      });
      const data = await res.json();
      if (data.creditedTo) {
        if (tile) tile.remove();
        _celebrate(data.creditedTo);
        setTimeout(_closePinOverlay, 1800);
      } else {
        _flashWrong();
      }
      return;
    }

    // Appliance dismiss
    if (!pin) {
      overlay.classList.add('hidden');
      if (tile) { tile.classList.remove('done'); const v = tile.querySelector('.tile-value'); if (v) v.textContent = 'Idle'; }
      fetch(`/api/dismiss/${key}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: null }) });
      return;
    }

    const res = await fetch(`/api/dismiss/${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin }),
    });
    const data = await res.json();

    if (data.creditedTo) {
      if (tile) { tile.classList.remove('done'); const v = tile.querySelector('.tile-value'); if (v) v.textContent = 'Idle'; }
      _celebrate(data.creditedTo);
      setTimeout(() => {
        overlay.classList.add('hidden');
        document.getElementById('pin-result').style.display = 'none';
        document.getElementById('pin-grid').style.display = 'grid';
        document.querySelector('.pin-dots').style.visibility = 'visible';
      }, 1800);
    } else {
      _flashWrong();
    }
  }

  let _longPressTimer = null, _longPressFired = false;

  document.getElementById('status-panel').addEventListener('pointerdown', (e) => {
    const tile = e.target.closest('.tile.chore-tile');
    if (!tile) return;
    _longPressFired = false;
    _longPressTimer = setTimeout(() => {
      _longPressFired = true;
      _longPressTimer = null;
      fetch(`/api/chores/${tile.dataset.choreId}`, { method: 'DELETE' });
      tile.remove();
    }, 700);
  });
  document.getElementById('status-panel').addEventListener('pointerup', () => {
    if (_longPressTimer) { clearTimeout(_longPressTimer); _longPressTimer = null; }
  });
  document.getElementById('status-panel').addEventListener('pointercancel', () => {
    if (_longPressTimer) { clearTimeout(_longPressTimer); _longPressTimer = null; }
  });

  document.getElementById('status-panel').addEventListener('click', (e) => {
    if (_longPressFired) { _longPressFired = false; return; }
    const tile = e.target.closest('.tile');
    if (!tile) return;
    if (tile.dataset.key === 'library') { openLibraryOverlay(); return; }
    if (tile.dataset.key === 'booksOut') { openBooksOutOverlay(); return; }
    if (tile.dataset.key === 'upNext') { showCalendarView(); return; }
    if (tile.dataset.key === 'poolPump' || tile.dataset.key === 'poolTemp') { showPoolView(); return; }
    if (tile.dataset.key === 'alerts') { openAlertOverlay(); return; }
    if (tile.dataset.key === 'batteries') { openBatteriesOverlay(); return; }
    const isChore = tile.classList.contains('chore-tile');
    const isDone  = tile.classList.contains('done');
    if (!isChore && !isDone) return;

    _pendingKey      = tile.dataset.key;
    _pendingTile     = tile;
    _pendingType     = isChore ? 'chore' : 'appliance';
    _pendingChoreId  = tile.dataset.choreId || null;
    _pinInput        = '';
    _updateDots();

    const label = tile.querySelector('.tile-label')?.textContent || 'it';
    document.getElementById('pin-title').textContent = isChore
      ? `Who did ${label.toLowerCase()}?`
      : `Who unloaded the ${label.toLowerCase()}?`;
    document.getElementById('pin-overlay').classList.remove('hidden');
  });

  document.getElementById('pin-grid').addEventListener('click', async (e) => {
    const btn = e.target.closest('.pin-key');
    if (!btn) return;
    const val = btn.dataset.val;
    if (val === 'skip') {
      await _submitDismiss(null);
    } else if (val === 'back') {
      _pinInput = _pinInput.slice(0, -1);
      _updateDots();
    } else if (_pinInput.length < 4) {
      _pinInput += val;
      _updateDots();
      if (_pinInput.length === 4) await _submitDismiss(_pinInput);
    }
  });

  /* ── Voice control ──────────────────────────────────────────────── */
  let _micStream, _recorder, _micChunks = [], _voiceState = 'idle';
  let _audioCtx;

  function setVoiceState(s) {
    _voiceState = s;
    const btn = document.getElementById('mic-btn');
    btn.className = s === 'idle' ? '' : s;
    btn.title = { idle: 'Tap to speak', listening: 'Tap to stop', processing: 'Processing…', playing: 'Playing…' }[s] || '';
  }

  async function startListening() {
    if (_voiceState === 'listening' && _recorder?.state === 'recording') {
      _recorder.stop();
      return;
    }
    if (_voiceState !== 'idle') return;
    try {
      if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      _micStream  = await navigator.mediaDevices.getUserMedia({ audio: true });
      _micChunks  = [];
      _recorder   = new MediaRecorder(_micStream, { mimeType: 'audio/webm;codecs=opus' });
      _recorder.ondataavailable = e => { if (e.data.size > 0) _micChunks.push(e.data); };
      _recorder.onstop = sendVoiceAudio;
      _recorder.start();
      setVoiceState('listening');
      setTimeout(() => { if (_voiceState === 'listening') _recorder.stop(); }, 10000);
    } catch (err) {
      console.error('Mic error:', err.message);
      setVoiceState('idle');
    }
  }

  async function sendVoiceAudio() {
    setVoiceState('processing');
    if (_micStream) _micStream.getTracks().forEach(t => t.stop());

    const blob       = new Blob(_micChunks, { type: 'audio/webm' });
    const controller = new AbortController();
    const timeout    = setTimeout(() => controller.abort(), 15000);

    try {
      const res = await fetch('/api/voice', {
        method:  'POST',
        headers: { 'Content-Type': 'audio/webm' },
        body:    blob,
        signal:  controller.signal,
      });
      clearTimeout(timeout);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { audio, silent } = await res.json();

      if (audio && !silent) {
        const wav = Uint8Array.from(atob(audio), c => c.charCodeAt(0));
        await _audioCtx.resume();
        const buf = await _audioCtx.decodeAudioData(wav.buffer);
        const src = _audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(_audioCtx.destination);
        src.start();
        setVoiceState('playing');
        src.onended = () => setVoiceState('idle');
      } else {
        setVoiceState('idle');
      }
    } catch (err) {
      clearTimeout(timeout);
      console.error('Voice error:', err.message);
      setVoiceState('idle');
    }
  }

  document.getElementById('mic-btn').addEventListener('click', startListening);

  /* ── Chat ───────────────────────────────────────────────────────── */
  let _chatHistory = [];
  let _chatBusy    = false;

  function openChat() {
    document.getElementById('chat-overlay').classList.add('open');
    document.getElementById('chat-btn').classList.add('open');
    document.getElementById('chat-input').focus();
  }

  function closeChat() {
    document.getElementById('chat-overlay').classList.remove('open');
    document.getElementById('chat-btn').classList.remove('open');
  }

  function appendChatMsg(role, text) {
    const msgs = document.getElementById('chat-messages');
    const el   = document.createElement('div');
    el.className    = `chat-msg ${role}`;
    el.textContent  = text;
    msgs.appendChild(el);
    msgs.scrollTop  = msgs.scrollHeight;
    return el;
  }

  async function sendChat() {
    if (_chatBusy) return;
    const input = document.getElementById('chat-input');
    const msg   = input.value.trim();
    if (!msg) return;

    input.value = '';
    _chatBusy   = true;
    document.getElementById('chat-send').disabled = true;

    appendChatMsg('user', msg);
    const thinking = appendChatMsg('thinking', 'Thinking…');

    const historySnapshot = [..._chatHistory];
    _chatHistory.push({ role: 'user', content: msg });

    let res;
    try {
      res = await fetch('/api/chat', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ message: msg, history: historySnapshot }),
      });
    } catch (err) {
      thinking.remove();
      appendChatMsg('assistant', 'Network error — check connection.');
      _chatHistory.pop();
      _chatBusy = false;
      document.getElementById('chat-send').disabled = false;
      return;
    }

    if (!res.ok || res.headers.get('content-type')?.includes('application/json')) {
      thinking.remove();
      const data = await res.json().catch(() => ({}));
      appendChatMsg('assistant', data.error || 'Chat unavailable right now.');
      _chatHistory.pop();
      _chatBusy = false;
      document.getElementById('chat-send').disabled = false;
      return;
    }

    // Streaming SSE response
    thinking.remove();
    const msgEl = appendChatMsg('assistant', '');
    const msgs  = document.getElementById('chat-messages');
    let fullText = '';

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop(); // keep incomplete line in buffer
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));
            if (data.token) {
              fullText += data.token;
              msgEl.textContent = fullText;
              msgs.scrollTop = msgs.scrollHeight;
            }
          } catch { /* skip malformed */ }
        }
      }
    } catch (err) {
      if (!fullText) msgEl.textContent = 'Stream interrupted — try again.';
    }

    if (fullText) {
      _chatHistory.push({ role: 'assistant', content: fullText });
    } else {
      _chatHistory.pop();
    }

    _chatBusy = false;
    document.getElementById('chat-send').disabled = false;
    document.getElementById('chat-input').focus();
  }

  document.getElementById('chat-btn').addEventListener('click', openChat);
  document.getElementById('chat-close').addEventListener('click', closeChat);
  document.getElementById('chat-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('chat-overlay')) closeChat();
  });
  document.getElementById('chat-send').addEventListener('click', sendChat);
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendChat();
  });

  /* ── Chore overlay ──────────────────────────────────────────────── */
  async function openChoreOverlay() {
    const presets = await fetch('/api/chores/presets').then(r => r.json()).catch(() => []);
    const container = document.getElementById('chore-presets');
    container.innerHTML = presets.map(p =>
      `<button class="chore-preset" data-name="${p.name}" data-icon="${p.icon}">${p.icon} ${p.name}</button>`
    ).join('');
    container.querySelectorAll('.chore-preset').forEach(btn => {
      btn.addEventListener('click', () => submitChore(btn.dataset.name, btn.dataset.icon));
    });
    document.getElementById('chore-overlay').classList.remove('hidden');
    document.getElementById('chore-btn').classList.add('open');
  }
  function closeChoreOverlay() {
    document.getElementById('chore-overlay').classList.add('hidden');
    document.getElementById('chore-btn').classList.remove('open');
    document.getElementById('chore-custom-input').value = '';
  }

  async function submitChore(name, icon) {
    if (!name) return;
    await fetch('/api/chores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, icon }),
    });
    closeChoreOverlay();
    refresh(); // show the new tile immediately
  }

  document.getElementById('chore-btn').addEventListener('click', openChoreOverlay);
  document.getElementById('chore-cancel').addEventListener('click', closeChoreOverlay);

  /* ── Library / Books Out overlay ──────────────────────────────────── */
  function _fmtDate(iso) {
    return iso
      ? new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'America/Los_Angeles' })
      : '';
  }
  function openLibraryOverlay() {
    const holds = _lastData?.status?.library?.readyHolds || [];
    document.getElementById('library-panel-title-text').textContent = 'Ready for Pickup';
    const list = document.getElementById('library-list');
    list.innerHTML = holds.length
      ? holds.map(h => `<div class="library-row">
          <div class="library-row-title">${h.title}</div>
          <div class="library-row-sub">${h.branch}${h.pickupBy ? ' · Pick up by ' + _fmtDate(h.pickupBy) : ''}</div>
        </div>`).join('')
      : '<div class="library-empty">No holds ready for pickup</div>';
    document.getElementById('library-overlay').classList.add('open');
  }
  function openBooksOutOverlay() {
    const books = _lastData?.status?.booksOut?.checkedOut || [];
    document.getElementById('library-panel-title-text').textContent = 'Books Out';
    const list = document.getElementById('library-list');
    list.innerHTML = books.length
      ? books.map(b => `<div class="library-row${b.overdue ? ' overdue' : ''}">
          <div class="library-row-title">${b.title}</div>
          <div class="library-row-sub">${b.branch}${b.dueDate ? ' · ' + (b.overdue ? 'Overdue since ' : 'Due ') + _fmtDate(b.dueDate) : ''}${!b.renewable && !b.overdue ? ' · Not renewable' : ''}</div>
        </div>`).join('')
      : '<div class="library-empty">No books checked out</div>';
    document.getElementById('library-overlay').classList.add('open');
  }
  function closeLibraryOverlay() {
    document.getElementById('library-overlay').classList.remove('open');
  }
  document.getElementById('library-close').addEventListener('click', closeLibraryOverlay);
  document.getElementById('library-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('library-overlay')) closeLibraryOverlay();
  });

  document.getElementById('chore-custom-add').addEventListener('click', () => {
    const name = document.getElementById('chore-custom-input').value.trim();
    if (name) submitChore(name, '🧹');
  });

  document.getElementById('chore-custom-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const name = document.getElementById('chore-custom-input').value.trim();
      if (name) submitChore(name, '🧹');
    }
  });

  /* ── Pool view rendering ────────────────────────────────────────── */
  /* Sweep card. Three separable failures, and "Not yet" used to hide all of
     them: it never ran, it ran but was cut short, or it ran fine but not since. */
  function _sweepCard(p) {
    if (p.sweepOn) {
      return { label: 'Sweep', value: 'Running', sub: 'started just now · 2h cap', cls: 'good' };
    }
    const ls = p.lastSweep;
    if (!ls) {
      // Cold start: the sweep_runs table is empty until the first run completes
      // after the v7 deploy, so this is the expected state for one evening. Say
      // that, rather than showing a bare warn that reads like a fault.
      return { label: 'Sweep', value: 'No runs logged', sub: 'first run records tonight, 9:45pm', cls: '' };
    }
    return {
      label: 'Last sweep',
      value: ls.text,                       // e.g. "Last night · 90 min"
      sub:   ls.detail,                     // e.g. "Ran 11:15pm for 90 min — full cycle"
      // Short OR stale both need attention; a full run last night is the only
      // state that should read as fine.
      cls:   (ls.ok && !ls.stale) ? 'good' : 'warn',
    };
  }

  function renderPool(data) {
    const p = data.pool || {};

    const cards = [
      { label: 'Water',
        value: p.waterTempF != null ? `${p.waterTempF}°F` : '—',
        sub:   p.padOnline ? 'HX inlet probe' : 'pad node offline',
        cls:   p.padOnline ? '' : 'warn' },
      { label: 'Main pump',
        value: p.pumpRunning ? 'Running' : 'Off',
        sub:   p.pumpWatts != null ? `${p.pumpWatts} W · one leg` : 'no meter data',
        cls:   p.pumpRunning ? 'good' : '' },
      { label: 'Heat recovery',
        value: p.heatActive
                 ? (p.deltaF != null ? `${p.deltaF > 0 ? '+' : ''}${p.deltaF}°F` : 'On')
                 : 'Idle',
        sub:   (p.hxInF != null && p.hxOutF != null) ? `${p.hxInF} → ${p.hxOutF}°F` : '—',
        cls:   p.heatActive ? (p.deltaF > 0 ? 'good' : 'warn') : '' },
      // Answers "did the LAST sweep go well", which is what you can actually
      // check during the day. sweepRanTonight is a latch the 23:45 check clears
      // every night, so it reads "Not yet" from midnight onward no matter what
      // happened -- it can only be trusted inside the 9:45-11:45pm window.
      _sweepCard(p),
    ];

    // Pump energised with no flow is a deadhead — running against a closed
    // valve. It outranks anything else this card would say.
    if (p.flowStatus === 'deadhead') {
      cards[1] = {
        label: 'Main pump', value: 'NO FLOW',
        sub: `${p.pumpWatts} W but ${p.flowGpm} GPM — check the valve`,
        cls: 'bad',
      };
    }

    document.getElementById('pool-hero').innerHTML = cards.map((c) => `
      <div class="pool-card ${c.cls}">
        <div class="pool-card-label">${c.label}</div>
        <div class="pool-card-value">${c.value}</div>
        <div class="pool-card-sub">${c.sub}</div>
      </div>`).join('');

    const noMeter = p.flowStatus === 'no_meter';
    const reads = [
      ['HX in',    p.hxInF  != null ? `${p.hxInF} °F`  : '—', ''],
      ['HX out',   p.hxOutF != null ? `${p.hxOutF} °F` : '—', ''],
      ['ΔT',       p.deltaF != null ? `${p.deltaF > 0 ? '+' : ''}${p.deltaF} °F` : '—', ''],
      ['Heat active', p.heatActive ? 'yes' : 'no', ''],
      ['Flow',     noMeter ? 'awaiting meter' : (p.flowGpm != null ? `${p.flowGpm} GPM` : '—'),
                   noMeter ? 'muted' : (p.flowStatus === 'deadhead' ? 'bad' : '')],
      ['BTU/hr',   noMeter ? 'awaiting meter' : (p.btuHr != null ? p.btuHr.toLocaleString() : '—'),
                   noMeter ? 'muted' : ''],
      ['Pump',     p.pumpWatts != null ? `${p.pumpWatts} W` : '—', ''],
      ['Pad node', p.padOnline ? 'online' : 'OFFLINE', p.padOnline ? '' : 'bad'],
    ];
    document.getElementById('pool-reads').innerHTML = reads.map(([k, v, cls]) => `
      <div class="pool-read">
        <span class="pool-read-k">${k}</span>
        <span class="pool-read-v ${cls}">${v}</span>
      </div>`).join('');

    // Footer: next action + alert summary
    const next = (data.nextActions || []).filter(a => a.domain === 'pool')[0];
    document.getElementById('pool-foot-next').innerHTML = next
      ? `<div class="fn-label">Next up</div>
         <div class="fn-body">${next.icon || ''} ${next.title} — ${next.basis}</div>`
      : `<div class="fn-label">Next up</div><div class="fn-body">Nothing scheduled</div>`;

    const open = data.alertDetail || [];
    const foot = document.getElementById('pool-foot');
    foot.classList.toggle('has-alerts', open.length > 0);
    document.getElementById('pool-foot-alerts').textContent = open.length
      ? `${open.length} open · highest L${open[0].level}`
      : 'No open alerts';
  }

  function renderPoolTimeline() {
    const pct = (h) => (h / 24) * 100;

    // Same 9pm-anchored frame as the charts below, so a position on this strip
    // means the same clock time as the position directly under it. Offsets are
    // hours from 9pm. Anchoring here also stops the 19h pump run wrapping
    // midnight into two bands, which the old midnight frame required.
    const bands = [
      { cls: 'pump',  from: 0,    to: 19   },   // 9pm - 4pm
      { cls: 'peak',  from: 19,   to: 24   },   // 4pm - 9pm
      { cls: 'sweep', from: 0.75, to: 2.25 },   // 9:45pm - 11:15pm
    ];

    document.getElementById('pool-tl-track').innerHTML =
      bands.map(b => `<div class="tl-band ${b.cls}" style="left:${pct(b.from)}%;width:${pct(b.to - b.from)}%"></div>`).join('') +
      `<div id="pool-tl-now" style="left:${(poolDayFrame().nowFrac * 100).toFixed(2)}%"></div>`;

    document.getElementById('pool-tl-axis').innerHTML =
      POOL_AXIS.map(l => `<span>${l}</span>`).join('');
  }

  /* ── Pool history charts ────────────────────────────────────────── */
  // Two stacked single-series charts on a shared time axis. Water temperature
  // (~78-86F) and heat-exchanger dT (~0-3F) live on different scales; putting
  // them on one plot with two y-axes would misrepresent both.
  // needsFlow: drop samples taken while the pump is off.
  //
  // With no flow the exchanger holds a static column of water and the two probes
  // decouple, drifting with the weather instead of the pool: measured +5.51F at
  // 08-08 16:58 with heat recovery OFF, and -- in the other direction -- both
  // probes falling 3F together after sunset on 08-09. Neither is exchanger
  // performance. Left in, that one afternoon excursion sets the y-scale and
  // squashes the real 0-1F heat-recovery signal into the bottom tenth of the plot.
  //
  // Gated on measured pump_watts, never on clock hours: the pump ran well past
  // its scheduled 4pm stop on 08-09, so the schedule is not a reliable proxy.
  const POOL_SERIES = [
    { key: 'hx_in_f', name: 'Water temperature', unit: '°F', color: '#3987e5' },
    { key: 'delta_f', name: 'Heat exchanger ΔT', unit: '°F', color: '#d95926',
      needsFlow: true, footNote: 'pump-off hours hidden' },
  ];

  const PUMP_ON_W = 20;   // matches POOL_PUMP_WATTS_THRESHOLD in server.js

  /* The pool day runs 9pm -> 8:59pm, anchored at the pump start so nothing
     wraps: the 19h pump run is one unbroken band, the 9:45-11:15pm sweep sits
     whole near the left edge, and the 4-9pm peak-rate block closes the frame.
     A midnight or 10pm anchor splits the sweep across both edges.

     Fixed, not rolling: the same clock hour is always in the same place, so the
     charts line up with the schedule timeline above them and the layout is
     learnable. Data fills in left-to-right as the day happens. */
  const POOL_DAY_START_H = 21;
  const POOL_DAY_S = 24 * 3600;
  const POOL_AXIS = ['9p', '12a', '3a', '6a', '9a', '12p', '3p', '6p', '9p'];

  function poolDayFrame() {
    const now = new Date();
    const start = new Date(now);
    start.setHours(POOL_DAY_START_H, 0, 0, 0);
    if (now.getTime() < start.getTime()) start.setDate(start.getDate() - 1);
    const t0 = Math.floor(start.getTime() / 1000);
    return { t0, t1: t0 + POOL_DAY_S, nowFrac: (Date.now() / 1000 - t0) / POOL_DAY_S };
  }

  let _poolHistory = null;

  async function loadPoolHistory() {
    try {
      // 25h, not 24: just before 9pm the frame reaches back a full 24h, and a
      // 24h request would clip the start of the window.
      const res = await fetch('/api/pool/history?hours=25');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      _poolHistory = (await res.json()).samples || [];
    } catch {
      _poolHistory = [];
    }
    renderPoolCharts();
  }

  function _buildPath(samples, series, frame) {
    const pts = samples
      .filter(s => s.recorded_at >= frame.t0 && s.recorded_at <= frame.t1)
      .filter(s => s[series.key] !== null && s[series.key] !== undefined)
      .filter(s => !series.needsFlow || (s.pump_watts != null && s.pump_watts > PUMP_ON_W))
      .map(s => ({ t: s.recorded_at, v: s[series.key] }));
    if (pts.length < 2) return null;

    const W = 1000, H = 100, PAD = 8;
    const vs = pts.map(p => p.v);
    let min = Math.min(...vs), max = Math.max(...vs);
    // A dead-flat series would divide by zero and render on the baseline;
    // give it a small band so the line sits mid-plot instead.
    if (max - min < 0.5) { const mid = (max + min) / 2; min = mid - 0.25; max = mid + 0.25; }

    // x is fixed to the frame, NOT to the data, so the line advances across the
    // plot as the day happens instead of always spanning the full width.
    const x = (t) => ((t - frame.t0) / POOL_DAY_S) * W;
    const y = (v) => H - PAD - ((v - min) / (max - min)) * (H - PAD * 2);

    // Break the line across masked stretches and logging gaps rather than
    // drawing a straight segment over hours of missing data. Idle logging is a
    // 10-min heartbeat, so anything past ~25 min is a real gap.
    const BREAK_S = 25 * 60;
    let d = '', prev = null;
    for (const p of pts) {
      d += `${prev === null || p.t - prev > BREAK_S ? 'M' : 'L'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)} `;
      prev = p.t;
    }

    return { d, min, max, last: pts[pts.length - 1].v, count: pts.length };
  }

  function renderPoolCharts() {
    const host = document.getElementById('pool-charts');
    const samples = _poolHistory || [];
    const frame = poolDayFrame();

    // Gridline every 3h, matching the axis labels. Heavier line at midnight and
    // noon so the eye can find the day boundary without reading the labels.
    const grid = POOL_AXIS.map((lbl, i) => {
      const gx = (i / (POOL_AXIS.length - 1)) * 1000;
      const heavy = lbl === '12a' || lbl === '12p' ? ' day' : '';
      return `<line class="chart-grid${heavy}" x1="${gx}" y1="0" x2="${gx}" y2="100"/>`;
    }).join('');
    const nowLine = `<line class="chart-nowln" x1="${(frame.nowFrac * 1000).toFixed(1)}" y1="0"
                           x2="${(frame.nowFrac * 1000).toFixed(1)}" y2="100"/>`;

    const blocks = POOL_SERIES.map((s) => {
      const p = _buildPath(samples, s, frame);
      if (!p) {
        return `<div class="chart-block">
            <div class="chart-head"><span class="chart-name">${s.name}</span></div>
            <div class="chart-empty">No samples yet — logging writes every 2 min<br>while heat recovery runs, 10 min otherwise.</div>
          </div>`;
      }
      const fmt = (n) => (Math.round(n * 10) / 10).toFixed(1);
      return `<div class="chart-block">
          <div class="chart-head">
            <span class="chart-name">${s.name}</span>
            <span class="chart-now" style="color:${s.color}">${fmt(p.last)} ${s.unit}</span>
          </div>
          <svg class="chart-svg" viewBox="0 0 1000 100" preserveAspectRatio="none">
            ${grid}${nowLine}
            <path d="${p.d}" fill="none" stroke="${s.color}" stroke-width="2"
                  stroke-linejoin="round" stroke-linecap="round"
                  vector-effect="non-scaling-stroke"/>
          </svg>
          <div class="chart-foot">
            <span>low ${fmt(p.min)}</span>
            <span>${s.footNote || `${p.count} samples`}</span>
            <span>high ${fmt(p.max)}</span>
          </div>
        </div>`;
    }).join('');

    host.innerHTML = blocks +
      `<div id="pool-chart-axis">${POOL_AXIS.map(l => `<span>${l}</span>`).join('')}</div>`;
  }

  /* ── Alert overlay ──────────────────────────────────────────────── */
  let _armedAck = null;   // L1 requires a second, deliberate tap

  function openAlertOverlay() {
    renderAlertOverlay(_lastData?.alertDetail || []);
    document.getElementById('alert-overlay').classList.add('open');
  }

  function closeAlertOverlay() {
    document.getElementById('alert-overlay').classList.remove('open');
    _armedAck = null;
    if (_onPool) bumpPoolTimer();
  }

  function renderAlertOverlay(detail) {
    const list = document.getElementById('alert-list');
    list.textContent = '';
    _armedAck = null;

    if (!detail.length) {
      const empty = document.createElement('div');
      empty.id = 'alert-empty';
      empty.textContent = 'No open alerts. Everything is being watched.';
      list.appendChild(empty);
      return;
    }

    for (const a of detail) {
      const row = document.createElement('div');
      row.className = `al-row l${a.level}`;

      const chip = document.createElement('div');
      chip.className = 'al-chip';
      chip.textContent = `L${a.level}`;
      row.appendChild(chip);

      const body = document.createElement('div');

      const title = document.createElement('div');
      title.className = 'al-title';
      title.textContent = a.title;
      body.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'al-meta';
      meta.appendChild(document.createTextNode(`Open ${a.ageText} · `));
      // The open flag never clears on recovery, so "still open" and "still
      // broken" are different questions. Answer the second one explicitly.
      const cond = document.createElement('span');
      if (a.conditionActive === null) {
        cond.className = 'al-cond';
        cond.textContent = 'no live check';
      } else if (a.conditionActive) {
        cond.className = 'al-cond active';
        cond.textContent = 'condition STILL ACTIVE';
      } else {
        cond.className = 'al-cond cleared';
        cond.textContent = 'condition cleared';
      }
      meta.appendChild(cond);
      body.appendChild(meta);

      const action = document.createElement('div');
      action.className = 'al-action';
      action.textContent = a.action;
      body.appendChild(action);

      row.appendChild(body);

      const btn = document.createElement('button');
      btn.className = 'al-ack';
      btn.textContent = 'Acknowledge';
      btn.addEventListener('click', () => ackAlert(a.key, a.level, btn));
      row.appendChild(btn);

      list.appendChild(row);
    }
  }

  async function ackAlert(key, level, btn) {
    // Acknowledging is not fixing, and a wall tablet is a much lower-friction
    // surface than the phone. Make the L1 case deliberate.
    if (level === 1 && _armedAck !== key) {
      _armedAck = key;
      btn.classList.add('armed');
      btn.textContent = "Confirm — I've seen it";
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Acknowledging…';
    try {
      const res = await fetch(`/api/alerts/${encodeURIComponent(key)}/ack`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error('ack failed');
      if (_lastData) {
        _lastData.alerts      = data.alerts;
        _lastData.alertDetail = data.alertDetail;
      }
      renderAlerts(data.alerts);
      renderAlertOverlay(data.alertDetail);
      if (_onPool && _lastData) renderPool(_lastData);
    } catch {
      btn.disabled = false;
      btn.classList.remove('armed');
      btn.textContent = 'Retry';
      _armedAck = null;
    }
  }

  document.getElementById('alert-panel-close').addEventListener('click', closeAlertOverlay);
  document.getElementById('alert-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'alert-overlay') closeAlertOverlay();
  });
  // The strip's ticker area only — the mic/chat/chore buttons live there too.
  document.getElementById('alert-ticker-wrap').addEventListener('click', openAlertOverlay);
  document.getElementById('pool-alerts-btn').addEventListener('click', openAlertOverlay);
  document.getElementById('pool-back-btn').addEventListener('click', showDashboardView);

  /* ── Boot ───────────────────────────────────────────────────────── */
  updateNightDim();
  setInterval(updateNightDim, 15_000);
  armIdleTimer();

  refresh();
  setInterval(refresh, REFRESH_INTERVAL_MS);
  setInterval(checkStaleness, 30_000);
  setInterval(tickAlert, 5_000);
  setInterval(tickBatteries, 5_000);
</script>
</body>
</html>
