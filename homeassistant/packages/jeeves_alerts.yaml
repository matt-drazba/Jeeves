# Jeeves — alerting
#
# Deploy: lives at ~/homelab/homeassistant/packages/jeeves_alerts.yaml on the Pi,
# arrives via `git pull`. configuration.yaml has:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Levels and their delivery rules are specified in docs/alerting_levels.md.
# In short — the level is WHEN YOU MUST ACT:
#
#   L1 now, anywhere, any hour  -> iOS Critical Alert, repeats until acknowledged
#   L2 in the morning           -> normal push now + 7:00am re-raise until acked
#   L3 when you get home        -> normal push now + 9:15pm re-raise until acked
#   L4 over the weekend         -> digest only, no push
#   L5 never                    -> logged; accumulation promotes to L4
#
# L3 uses a fixed 9:15pm checkpoint rather than a presence trigger. Presence is
# fragile and hard to reason about; 9:15pm is reliably "home", and it batches
# with the existing dishwasher reminder.
#
# iOS Critical Alerts verified working 2026-08-07: full volume through the
# silent switch, and the Acknowledge button routes back to HA.
#
# L1 IS RESERVED. Only "something is being destroyed and only you can stop it"
# qualifies, and the message must name the physical action to take.

# ===========================================================================
# Helpers
# ===========================================================================
input_boolean:
  pool_maintenance:
    name: Pool Maintenance Mode
    icon: mdi:wrench
    # Turn ON before backwashing or servicing the pad.
    #
    # Suppresses L2-L4 notifications. Deliberately does NOT suppress L1, and
    # never prevents the booster kill itself from firing. Muting nuisance
    # alerts is legitimate; disabling protection against destruction is not.

  # "Open" = this alert has fired and has not been acknowledged yet. Cleared
  # only by tapping Acknowledge, so nothing silently disappears overnight —
  # a fault that self-heals at 2am still gets raised at 7am, because you
  # should know it happened.
  alert_open_pump_off:
    name: Open Alert - Main Pump Off
    icon: mdi:alert-circle-outline

  alert_open_booster_dry_run:
    name: Open Alert - Booster Dry Run
    icon: mdi:alert-circle-outline

  alert_open_booster_kill_failed:
    name: Open Alert - Booster Kill Failed
    icon: mdi:alert-octagon

  alert_open_pad_offline:
    name: Open Alert - Pool Pad Node Offline
    icon: mdi:lan-disconnect

  alert_open_meter_offline:
    name: Open Alert - Pump Meter Offline
    icon: mdi:lan-disconnect

  alert_open_sweep_skipped:
    name: Open Alert - Sweep Did Not Run
    icon: mdi:robot-vacuum-off

  alert_open_hx_no_transfer:
    name: Open Alert - Heat Exchanger Not Transferring
    icon: mdi:heat-wave

  # Latch, not an alert flag. Set the moment the sweep actually switches on
  # inside its window; checked and reset at 11:45pm. This is what makes a
  # SILENT skip visible — the schedule deliberately declines to start the
  # booster against an unproven pump, and without this that decision leaves
  # no trace anywhere.
  sweep_ran_tonight:
    name: Sweep Ran Tonight
    icon: mdi:robot-vacuum

# ===========================================================================
# Problem detectors
# ===========================================================================
template:
  - binary_sensor:
      # ---------------------------------------------------------------------
      # L2 — main pump not running during its 9pm-4pm window. Breaker trip,
      # outage, IntelliComm fault, or lost prime.
      #
      # 15-minute debounce: the pump ramps, and Program 4 transitions would
      # false-positive an instantaneous trigger.
      #
      # The has_value guard means an offline meter does NOT fire this. "Pump
      # died" and "meter died" are different problems with different fixes.
      # ---------------------------------------------------------------------
      - name: "Pool Pump Unexpectedly Off"
        unique_id: pool_pump_unexpectedly_off
        device_class: problem
        delay_on: "00:15:00"
        state: >
          {{ has_value('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
             and (states('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
                  | float(0)) < 20
             and (now() >= today_at('21:00') or now() < today_at('16:00'))
             and is_state('input_boolean.pool_maintenance', 'off') }}

      # ---------------------------------------------------------------------
      # Booster (Polaris PB4-60) on while the main pump draws nothing.
      #
      # The PB4-60 is not self-priming and has no dry-run protection. Its seal
      # is water-lubricated; run dry, the faces overheat within minutes and melt
      # the impeller around the seal's porcelain face. A dry centrifugal pump
      # draws LESS current than a loaded one, so no breaker, overload, or
      # high-amp rule will ever catch this.
      #
      # 30-second debounce, not 15 minutes. The tradeoff is asymmetric: a false
      # kill costs one night of sweeping, a missed kill costs a pump.
      #
      # float(0) on an unavailable meter is deliberate — unknown pump state
      # reads as "pump off", so a dead sensor kills the booster. Fails closed.
      #
      # No maintenance-mode condition here, by design.
      # ---------------------------------------------------------------------
      - name: "Pool Booster Dry Run"
        unique_id: pool_booster_dry_run
        device_class: problem
        delay_on: "00:00:30"
        state: >
          {{ is_state('switch.pool_sweep_socket_1', 'on')
             and (states('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
                  | float(0)) < 20 }}

      # ---------------------------------------------------------------------
      # Plain "is the main pump energized" signal, used by the sweep schedule
      # to satisfy the PB4-60 manual's "start at least 30 minutes after the
      # filtration pump" rule via a `for:` condition.
      #
      # 20 W answers "energized at all" and is deliberately independent of RPM
      # and filter state — the pump draws ~172 W on one leg at current RPM, so
      # a higher threshold would false-negative at lower speeds.
      #
      # has_value guard means an offline meter reads as NOT running, so the
      # sweep is skipped rather than started blind. Fails closed.
      # ---------------------------------------------------------------------
      - name: "Pool Pump Running"
        unique_id: pool_pump_running
        state: >
          {{ has_value('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
             and (states('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
                  | float(0)) > 20 }}

      # ---------------------------------------------------------------------
      # L3 — sensor liveness. These exist because every L1 and L2 rule above
      # silently stops protecting anything the moment its sensor dies, and a
      # dead sensor looks exactly like a healthy pool.
      #
      # The pump meter one matters most: the booster dry-run kill fails CLOSED
      # on an unavailable meter, so a dead Shelly does not endanger the pump —
      # it stops the sweep from ever running. Silent, and only noticed weeks
      # later as a dirty pool.
      #
      # 30-minute debounce rides out a Wi-Fi blip or an HA restart.
      # ---------------------------------------------------------------------
      - name: "Pool Pad Node Offline"
        unique_id: pool_pad_node_offline
        device_class: problem
        delay_on: "00:30:00"
        state: "{{ not has_value('sensor.pool_pad_hx_water_in_temp') }}"

      - name: "Pool Pump Meter Offline"
        unique_id: pool_pump_meter_offline
        device_class: problem
        delay_on: "00:30:00"
        state: >
          {{ not has_value(
               'sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power') }}

      # ---------------------------------------------------------------------
      # L3 — heat recovery is calling but the exchanger moves no heat.
      #
      # Deliberately triggers on delta <= 0 (outlet no warmer than inlet), NOT
      # on "delta is small". Stage-1 compressor runs legitimately produce small
      # HX gains (see pool_heat_recovery.md), and out_temp_offset_f is still a
      # provisional 0.3 F, so any "small delta" threshold would fire constantly
      # during normal low-stage operation. Zero or negative transfer while the
      # FPH is calling is unambiguous.
      #
      # 20-minute debounce: water temperature moves slowly and the pad node
      # only samples every couple of minutes.
      # ---------------------------------------------------------------------
      - name: "Pool HX Not Transferring"
        unique_id: pool_hx_not_transferring
        device_class: problem
        delay_on: "00:20:00"
        state: >
          {{ is_state('binary_sensor.pool_pad_pool_heat_active', 'on')
             and has_value('sensor.pool_pad_hx_water_in_temp')
             and has_value('sensor.pool_pad_hx_water_out_temp')
             and (states('sensor.pool_pad_hx_water_out_temp') | float(0))
                 - (states('sensor.pool_pad_hx_water_in_temp') | float(0))
                 <= 0 }}

# ===========================================================================
# Notification scripts — one per delivery style
# ===========================================================================
script:
  critical_alert:
    alias: "Send Critical Alert (L1)"
    description: >
      L1 ONLY. iOS Critical Alert — full volume through the silent switch and
      Do Not Disturb, any hour, any timezone. The message must name the
      physical action to take.
    mode: parallel
    max: 10
    fields:
      title: {description: Notification title}
      message: {description: Notification body — must name the physical action}
      tag: {description: Collapse key so repeats replace rather than stack}
      ack_action: {description: Action id fired when Acknowledge is tapped}
    sequence:
      - service: notify.mobile_app_matt_drazba_s_iphone
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1.0
            tag: "{{ tag }}"
            actions:
              - action: "{{ ack_action }}"
                title: "Acknowledge"
                destructive: true

  normal_alert:
    alias: "Send Normal Alert (L2-L3)"
    description: >
      Standard push. Respects Do Not Disturb — will not wake anyone. Used for
      L2 (with a 7am re-notify) and L3.
    mode: parallel
    max: 10
    fields:
      title: {description: Notification title}
      message: {description: Notification body}
      tag: {description: Collapse key}
      ack_action: {description: Action id fired when Acknowledge is tapped}
    sequence:
      - service: notify.mobile_app_matt_drazba_s_iphone
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            tag: "{{ tag }}"
            actions:
              - action: "{{ ack_action }}"
                title: "Acknowledge"

# ===========================================================================
# Automations
# ===========================================================================
automation:
  # -------------------------------------------------------------------------
  # Booster dry run — kill first, then classify by whether the kill worked.
  #
  # The switch is turned off before anything else. The damage window is
  # minutes; the notification is not what saves the pump.
  #
  # The kill goes to a TUYA CLOUD switch, so it is a round trip that can be
  # slow, fail outright, or be overridden by a schedule still living in the
  # Tuya app. That is why the off command is verified rather than assumed:
  #
  #   kill confirmed   -> L2. Damage stopped. Find out why in the morning.
  #   kill unconfirmed -> L1. Still being destroyed, HA is out of options,
  #                       only a human at the breaker can stop it.
  #
  # NOTE: this is the watts-based interim version, using only hardware already
  # installed. The flow-gated interlock in docs/pool_booster_interlock.md
  # supersedes it once the DN50 flow meter is installed and calibrated.
  #
  # NOTE: only fully effective once the sweep schedule is DELETED from the
  # Tuya app. Until then Tuya can re-command the switch on while HA is down.
  # -------------------------------------------------------------------------
  - id: jeeves_booster_dry_run_kill
    alias: "Pool: booster dry-run kill"
    description: >
      Booster on while the main pump draws under 20 W. Kills the switch, then
      verifies. Confirmed kill is L2; unconfirmed kill escalates to L1.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.pool_booster_dry_run
        to: "on"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.pool_sweep_socket_1

      # Give the Tuya cloud round trip time to land, then retry once before
      # concluding that HA cannot stop this.
      - delay: "00:00:20"
      - if:
          - condition: state
            entity_id: switch.pool_sweep_socket_1
            state: "on"
        then:
          - service: switch.turn_off
            target:
              entity_id: switch.pool_sweep_socket_1
          - delay: "00:00:15"

      - choose:
          # ---------------------------------------------------------------
          # L1 — the kill did not take. Pump is still being destroyed.
          # ---------------------------------------------------------------
          - conditions:
              - condition: state
                entity_id: switch.pool_sweep_socket_1
                state: "on"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.alert_open_booster_kill_failed
              - repeat:
                  sequence:
                    - service: script.critical_alert
                      data:
                        title: "POOL BOOSTER RUNNING DRY"
                        message: >
                          Could not switch the sweep off — Tuya did not respond.
                          The booster is running without water and will destroy
                          its seal within minutes. GO KILL THE BREAKER FOR THE
                          SWEEP CIRCUIT NOW.
                        tag: "pool-booster-kill-failed"
                        ack_action: "ACK_BOOSTER_KILL_FAILED"
                    - delay: "00:05:00"
                  while:
                    - condition: state
                      entity_id: input_boolean.alert_open_booster_kill_failed
                      state: "on"
                    - condition: template
                      value_template: "{{ repeat.index < 24 }}"

        # -----------------------------------------------------------------
        # L2 — kill confirmed. Damage stopped; diagnosis can wait for morning.
        # -----------------------------------------------------------------
        default:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.alert_open_booster_dry_run
          - condition: state
            entity_id: input_boolean.pool_maintenance
            state: "off"
          - service: script.normal_alert
            data:
              title: "Pool sweep shut off — booster was running dry"
              message: >
                The booster was on with the main pump at
                {{ states('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
                }} W. Sweep switched off and confirmed. The pump is safe. Check
                why the main pump was not running before sweeping again.
              tag: "pool-booster-dry-run"
              ack_action: "ACK_BOOSTER_DRY_RUN"

  # -------------------------------------------------------------------------
  # L2 — main pump off during its run window. Nothing automatic can restart a
  # tripped breaker, but the pool tolerates a night unfiltered. Sleep is fine.
  # -------------------------------------------------------------------------
  - id: jeeves_pump_unexpectedly_off
    alias: "Pool: main pump unexpectedly off"
    description: >
      Pump drawing under 20 W for 15 minutes inside its 9pm-4pm run window.
      Normal push now, re-raised at 7am until acknowledged.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.pool_pump_unexpectedly_off
        to: "on"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.alert_open_pump_off
      - service: script.normal_alert
        data:
          title: "Pool pump is off"
          message: >
            Main pump has been drawing under 20 W for 15 minutes during its
            scheduled run window. No filtration and no heat recovery.
          tag: "pool-pump-off"
          ack_action: "ACK_PUMP_OFF"

  # -------------------------------------------------------------------------
  # The L2 delivery mechanism. "In the morning" means the alert survives the
  # night without waking anyone and is still in front of you at breakfast —
  # that is a re-notification, not a louder notification.
  # -------------------------------------------------------------------------
  - id: jeeves_l2_morning_renotify
    alias: "Alerts: 7am re-raise of unacknowledged L2"
    description: Re-sends every L2 alert still open at 7am.
    mode: single
    trigger:
      - platform: time
        at: "07:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.pool_maintenance
        state: "off"
    action:
      - if:
          - condition: state
            entity_id: input_boolean.alert_open_pump_off
            state: "on"
        then:
          - service: script.normal_alert
            data:
              title: "Still open: pool pump was off"
              message: >
                The main pump alert from overnight has not been acknowledged.
                Current draw:
                {{ states('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
                }} W.
              tag: "pool-pump-off"
              ack_action: "ACK_PUMP_OFF"

      - if:
          - condition: state
            entity_id: input_boolean.alert_open_booster_dry_run
            state: "on"
        then:
          - service: script.normal_alert
            data:
              title: "Still open: sweep was shut off"
              message: >
                The booster dry-run alert has not been acknowledged. Check why
                the main pump was not running before sweeping again.
              tag: "pool-booster-dry-run"
              ack_action: "ACK_BOOSTER_DRY_RUN"

  # -------------------------------------------------------------------------
  # L3 — sensor offline. Nothing is being damaged; the house has just gone
  # partially blind. Push once, then re-raise each evening until acknowledged.
  # -------------------------------------------------------------------------
  - id: jeeves_pool_sensor_offline
    alias: "Pool: sensor offline"
    description: >
      A pool sensor has stopped reporting for 30 minutes. Alerts that depend on
      it are not protecting anything until it returns.
    mode: parallel
    trigger:
      - platform: state
        entity_id: binary_sensor.pool_pad_node_offline
        to: "on"
        id: pad_offline
      - platform: state
        entity_id: binary_sensor.pool_pump_meter_offline
        to: "on"
        id: meter_offline
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: "input_boolean.alert_open_{{ trigger.id }}"
      - service: script.normal_alert
        data:
          title: >
            {{ 'Pool pad node offline' if trigger.id == 'pad_offline'
               else 'Pool pump meter offline' }}
          message: >
            {{ 'The pool pad ESP has not reported for 30 minutes. HX temps,
                flow and BTU readings are dead.'
               if trigger.id == 'pad_offline' else
               'The Shelly EM pump meter has not reported for 30 minutes. The
                booster dry-run kill fails closed on a dead meter, so the sweep
                will not run until this is back.' }}
          tag: "pool-{{ trigger.id }}"
          ack_action: "ACK_{{ trigger.id | upper }}"

  # -------------------------------------------------------------------------
  # L3 — pad equipment faults. Nothing is being damaged; something is running
  # without doing its job.
  # -------------------------------------------------------------------------
  - id: jeeves_pool_equipment_fault
    alias: "Pool: heat exchanger not transferring"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.pool_hx_not_transferring
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.pool_maintenance
        state: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.alert_open_hx_no_transfer
      - service: script.normal_alert
        data:
          title: "Heat exchanger is not transferring heat"
          message: >
            Heat recovery is calling but the HX outlet is no warmer than the
            inlet. In {{ states('sensor.pool_pad_hx_water_in_temp') }} F, out
            {{ states('sensor.pool_pad_hx_water_out_temp') }} F. Check the FPH
            pump and the pad valves.
          tag: "pool-hx_no_transfer"
          ack_action: "ACK_HX_NO_TRANSFER"

  # -------------------------------------------------------------------------
  # The L3 delivery mechanism. Fixed 9:15pm checkpoint rather than a presence
  # trigger — presence is fragile, and this batches with the dishwasher nudge.
  # -------------------------------------------------------------------------
  - id: jeeves_l3_evening_renotify
    alias: "Alerts: 9:15pm re-raise of unacknowledged L3"
    description: Re-sends every L3 alert still open at 9:15pm.
    mode: single
    trigger:
      - platform: time
        at: "21:15:00"
    condition:
      - condition: state
        entity_id: input_boolean.pool_maintenance
        state: "off"
    action:
      - if:
          - condition: state
            entity_id: input_boolean.alert_open_pad_offline
            state: "on"
        then:
          - service: script.normal_alert
            data:
              title: "Still open: pool pad node offline"
              message: >
                The pool pad ESP is still not reporting. Heat recovery and flow
                data are dark.
              tag: "pool-pad_offline"
              ack_action: "ACK_PAD_OFFLINE"

      - if:
          - condition: state
            entity_id: input_boolean.alert_open_meter_offline
            state: "on"
        then:
          - service: script.normal_alert
            data:
              title: "Still open: pump meter offline"
              message: >
                The Shelly EM is still not reporting. The sweep will not run
                and the pump-off alert is blind until it returns.
              tag: "pool-meter_offline"
              ack_action: "ACK_METER_OFFLINE"

      - if:
          - condition: state
            entity_id: input_boolean.alert_open_sweep_skipped
            state: "on"
        then:
          - service: script.normal_alert
            data:
              title: "Still open: sweep did not run"
              message: >
                The sweep was skipped on a previous night and has not been
                acknowledged. If the pool looks fine, just acknowledge it.
              tag: "pool-sweep-skipped"
              ack_action: "ACK_SWEEP_SKIPPED"

      - if:
          - condition: state
            entity_id: input_boolean.alert_open_hx_no_transfer
            state: "on"
        then:
          - service: script.normal_alert
            data:
              title: "Still open: heat exchanger not transferring"
              message: >
                Unacknowledged. Heat recovery called but moved no heat. Check
                the FPH pump and the pad valves.
              tag: "pool-hx_no_transfer"
              ack_action: "ACK_HX_NO_TRANSFER"

  # -------------------------------------------------------------------------
  # Acknowledge buttons. trigger.id is the suffix of the matching flag, so one
  # automation serves every alert.
  # -------------------------------------------------------------------------
  - id: jeeves_alert_acknowledged
    alias: "Alerts: acknowledge button tapped"
    mode: parallel
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ACK_PUMP_OFF"
        id: pump_off
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ACK_BOOSTER_DRY_RUN"
        id: booster_dry_run
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ACK_BOOSTER_KILL_FAILED"
        id: booster_kill_failed
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ACK_PAD_OFFLINE"
        id: pad_offline
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ACK_METER_OFFLINE"
        id: meter_offline
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ACK_SWEEP_SKIPPED"
        id: sweep_skipped
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ACK_HX_NO_TRANSFER"
        id: hx_no_transfer
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: "input_boolean.alert_open_{{ trigger.id }}"

  # =========================================================================
  # SWEEP SCHEDULE — HA runs 9:45pm - 11:15pm. HA is the ONLY thing that
  # commands this switch.
  #
  # The Tuya app schedule was deleted 2026-08-08 after HA was observed running
  # the sweep correctly (on 04:45 UTC, off 06:15 UTC). During the trial the two
  # schedules ran overlapped — HA 9:45-11:15 nested inside Tuya's 10:00-11:30 —
  # which kept Tuya as a backup and made the start time reveal which system
  # acted. Both jobs are done; do not re-add a schedule to the Tuya app.
  #
  # That deletion is what makes the dry-run interlock actually safe. The Tuya
  # switch is now a dumb relay, so every failure (HA down, network down, Tuya
  # cloud down) degrades to "the booster never runs." Dirty pool, healthy pump.
  # A schedule living in the Tuya app could start the booster by itself with no
  # idea whether the main pump is running.
  #
  # If HA misses a night, nothing starts the sweep and the 11:45pm
  # "sweep did not run" check reports it the next morning.
  #
  # Manual rules being satisfied (PB4-60 install manual):
  #   "start at least half an hour AFTER the filtration pump"  -> pump starts
  #     9pm, sweep 9:45pm (45 min), and the >=30 min condition is enforced
  #     against measured pump draw rather than assumed from the clock
  #   "stop at least half an hour BEFORE the filtration pump"  -> pump runs to
  #     4pm, leaving 16.75 h of margin
  #
  # INTERIM: gates on pump WATTS, not flow — same limitation as the dry-run
  # kill. Watts prove the pump is energized, not that it is moving enough
  # water. The DN50 flow meter replaces this condition.
  # =========================================================================
  - id: jeeves_sweep_schedule_on
    alias: "Pool: sweep schedule on"
    description: >
      Starts the Polaris at 9:45pm, but only if the main pump has genuinely
      been running for 30 minutes. If it has not, the sweep is skipped rather
      than started against an unproven pump. A skip is reported by the 11:45pm
      "sweep did not run" check.
    mode: single
    trigger:
      - platform: time
        at: "21:45:00"
    condition:
      - condition: state
        entity_id: binary_sensor.pool_pump_running
        state: "on"
        for: "00:30:00"
      - condition: state
        entity_id: input_boolean.pool_maintenance
        state: "off"
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.pool_sweep_socket_1

  - id: jeeves_sweep_schedule_off
    alias: "Pool: sweep schedule off"
    description: Ends the sweep window. Unconditional — always turns off.
    mode: single
    trigger:
      - platform: time
        at: "23:15:00"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.pool_sweep_socket_1

  # -------------------------------------------------------------------------
  # Backstop against the sweep running for hours unattended — if HA misses the
  # 11:15pm off trigger, the Polaris would otherwise run until the main pump
  # stops at 4pm. Not damaging (there is water), but needless wear and ~1.5 kW
  # of billing.
  #
  # This is a COST AND WEAR backstop, not a safety interlock. The safety
  # interlock is the dry-run kill, which is independent, has no maintenance
  # condition, and stays armed at all times.
  #
  # It used to be a window guard: sweep on outside 9:45-11:15pm -> off, checked
  # every 15 minutes. That over-reached. It treated a deliberate button press as
  # a fault and killed it within 15 minutes, silently, so manual control simply
  # appeared broken. Trading away the ability to run your own pool cleaner to
  # save roughly 75 cents of electricity is the wrong trade. (It also could not
  # do the job its comment claimed: if HA is down at 11:15pm, this automation's
  # own time_pattern trigger is down too.)
  #
  # Now it caps total runtime instead of policing the clock. A manual press
  # works at any hour and runs a full cycle; only a genuinely stuck-on sweep
  # gets shut off. The scheduled run is 90 minutes, so the 100-minute cap never
  # interferes with it.
  #
  # Uses time_pattern + last_changed rather than a state trigger with `for:`,
  # so it still fires for a sweep that was already on when HA started.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Records that the sweep actually ran. Triggers on the switch going on from
  # ANY source — HA's schedule or a manual press — because the question being
  # answered is "did the pool get cleaned", not "did my automation fire".
  # -------------------------------------------------------------------------
  - id: jeeves_sweep_ran_latch
    alias: "Pool: record that the sweep ran"
    mode: single
    trigger:
      - platform: state
        entity_id: switch.pool_sweep_socket_1
        to: "on"
    condition:
      - condition: template
        value_template: >
          {{ today_at('21:45') <= now() < today_at('23:15') }}
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.sweep_ran_tonight

  # -------------------------------------------------------------------------
  # L3 — the sweep never ran tonight.
  #
  # Closes the one silent failure in the schedule: if the main pump has not
  # been running for 30 minutes at 9:45pm, the sweep is deliberately skipped
  # rather than started against an unproven pump. That is the correct and safe
  # behaviour, but on its own it is indistinguishable from a working system,
  # and the only symptom is a gradually dirtier pool.
  #
  # Runs at 11:45pm, comfortably after the window closes at 11:15.
  # -------------------------------------------------------------------------
  - id: jeeves_sweep_missed_check
    alias: "Pool: sweep did not run tonight"
    description: >
      Checks at 11:45pm whether the sweep ran at all, then resets the latch for
      tomorrow. Skipped entirely while maintenance mode is on.
    mode: single
    trigger:
      - platform: time
        at: "23:45:00"
    action:
      - if:
          - condition: state
            entity_id: input_boolean.sweep_ran_tonight
            state: "off"
          - condition: state
            entity_id: input_boolean.pool_maintenance
            state: "off"
        then:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.alert_open_sweep_skipped
          - service: script.normal_alert
            data:
              title: "Pool sweep did not run tonight"
              message: >
                The sweep was skipped — the main pump had not been running long
                enough at 9:45pm to start the booster safely. Pump is currently
                at
                {{ states('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
                }} W. Check the pump schedule.
              tag: "pool-sweep-skipped"
              ack_action: "ACK_SWEEP_SKIPPED"

      # Always reset, whether or not it ran, so tomorrow starts clean.
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.sweep_ran_tonight

  - id: jeeves_sweep_max_runtime
    alias: "Pool: sweep exceeded max runtime"
    description: >
      Turns the sweep off once it has run continuously for longer than any
      legitimate cycle. Replaces the old outside-window guard, so pressing the
      Tuya button by hand works at any hour — no maintenance mode required.

      Informational notification only: no open-alert flag, and notify is called
      directly rather than through script.normal_alert, because there is
      nothing to acknowledge and an Acknowledge button that clears nothing is
      a lie.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: state
        entity_id: switch.pool_sweep_socket_1
        state: "on"
      - condition: state
        entity_id: input_boolean.pool_maintenance
        state: "off"
      # 100 minutes. The scheduled run is 90 (21:45-23:15), so this only ever
      # catches a sweep that should have stopped and didn't.
      - condition: template
        value_template: >
          {{ (now() - states.switch.pool_sweep_socket_1.last_changed).total_seconds() > 6000 }}
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.pool_sweep_socket_1
      - service: notify.mobile_app_matt_drazba_s_iphone
        data:
          title: "Pool sweep turned off"
          message: >
            The Polaris had been running over 100 minutes, so it was shut off.
            If you started it by hand, just press it again for another cycle.
          data:
            tag: sweep_max_runtime
