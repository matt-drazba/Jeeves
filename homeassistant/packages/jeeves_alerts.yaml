# Jeeves — alerting
#
# Deploy: lives at ~/homelab/homeassistant/packages/jeeves_alerts.yaml on the Pi,
# arrives via `git pull`. configuration.yaml has:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Levels and their delivery rules are specified in docs/alerting_levels.md.
# In short — the level is WHEN YOU MUST ACT:
#
#   L1 now, anywhere, any hour  -> iOS Critical Alert, repeats until acknowledged
#   L2 in the morning           -> normal push now + 7am re-notify until acked
#   L3 when you get home        -> normal push, re-notify on arrival
#   L4 over the weekend         -> digest only, no push
#   L5 never                    -> logged; accumulation promotes to L4
#
# iOS Critical Alerts verified working 2026-08-07: full volume through the
# silent switch, and the Acknowledge button routes back to HA.
#
# L1 IS RESERVED. Only "something is being destroyed and only you can stop it"
# qualifies, and the message must name the physical action to take.

# ===========================================================================
# Helpers
# ===========================================================================
input_boolean:
  pool_maintenance:
    name: Pool Maintenance Mode
    icon: mdi:wrench
    # Turn ON before backwashing or servicing the pad.
    #
    # Suppresses L2-L4 notifications. Deliberately does NOT suppress L1, and
    # never prevents the booster kill itself from firing. Muting nuisance
    # alerts is legitimate; disabling protection against destruction is not.

  # "Open" = this alert has fired and has not been acknowledged yet. Cleared
  # only by tapping Acknowledge, so nothing silently disappears overnight —
  # a fault that self-heals at 2am still gets raised at 7am, because you
  # should know it happened.
  alert_open_pump_off:
    name: Open Alert - Main Pump Off
    icon: mdi:alert-circle-outline

  alert_open_booster_dry_run:
    name: Open Alert - Booster Dry Run
    icon: mdi:alert-circle-outline

  alert_open_booster_kill_failed:
    name: Open Alert - Booster Kill Failed
    icon: mdi:alert-octagon

# ===========================================================================
# Problem detectors
# ===========================================================================
template:
  - binary_sensor:
      # ---------------------------------------------------------------------
      # L2 — main pump not running during its 9pm-4pm window. Breaker trip,
      # outage, IntelliComm fault, or lost prime.
      #
      # 15-minute debounce: the pump ramps, and Program 4 transitions would
      # false-positive an instantaneous trigger.
      #
      # The has_value guard means an offline meter does NOT fire this. "Pump
      # died" and "meter died" are different problems with different fixes.
      # ---------------------------------------------------------------------
      - name: "Pool Pump Unexpectedly Off"
        unique_id: pool_pump_unexpectedly_off
        device_class: problem
        delay_on: "00:15:00"
        state: >
          {{ has_value('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
             and (states('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
                  | float(0)) < 20
             and (now() >= today_at('21:00') or now() < today_at('16:00'))
             and is_state('input_boolean.pool_maintenance', 'off') }}

      # ---------------------------------------------------------------------
      # Booster (Polaris PB4-60) on while the main pump draws nothing.
      #
      # The PB4-60 is not self-priming and has no dry-run protection. Its seal
      # is water-lubricated; run dry, the faces overheat within minutes and melt
      # the impeller around the seal's porcelain face. A dry centrifugal pump
      # draws LESS current than a loaded one, so no breaker, overload, or
      # high-amp rule will ever catch this.
      #
      # 30-second debounce, not 15 minutes. The tradeoff is asymmetric: a false
      # kill costs one night of sweeping, a missed kill costs a pump.
      #
      # float(0) on an unavailable meter is deliberate — unknown pump state
      # reads as "pump off", so a dead sensor kills the booster. Fails closed.
      #
      # No maintenance-mode condition here, by design.
      # ---------------------------------------------------------------------
      - name: "Pool Booster Dry Run"
        unique_id: pool_booster_dry_run
        device_class: problem
        delay_on: "00:00:30"
        state: >
          {{ is_state('switch.pool_sweep_socket_1', 'on')
             and (states('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
                  | float(0)) < 20 }}

      # ---------------------------------------------------------------------
      # Plain "is the main pump energized" signal, used by the sweep schedule
      # to satisfy the PB4-60 manual's "start at least 30 minutes after the
      # filtration pump" rule via a `for:` condition.
      #
      # 20 W answers "energized at all" and is deliberately independent of RPM
      # and filter state — the pump draws ~172 W on one leg at current RPM, so
      # a higher threshold would false-negative at lower speeds.
      #
      # has_value guard means an offline meter reads as NOT running, so the
      # sweep is skipped rather than started blind. Fails closed.
      # ---------------------------------------------------------------------
      - name: "Pool Pump Running"
        unique_id: pool_pump_running
        state: >
          {{ has_value('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
             and (states('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
                  | float(0)) > 20 }}

# ===========================================================================
# Notification scripts — one per delivery style
# ===========================================================================
script:
  critical_alert:
    alias: "Send Critical Alert (L1)"
    description: >
      L1 ONLY. iOS Critical Alert — full volume through the silent switch and
      Do Not Disturb, any hour, any timezone. The message must name the
      physical action to take.
    mode: parallel
    max: 10
    fields:
      title: {description: Notification title}
      message: {description: Notification body — must name the physical action}
      tag: {description: Collapse key so repeats replace rather than stack}
      ack_action: {description: Action id fired when Acknowledge is tapped}
    sequence:
      - service: notify.mobile_app_matt_drazba_s_iphone
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1.0
            tag: "{{ tag }}"
            actions:
              - action: "{{ ack_action }}"
                title: "Acknowledge"
                destructive: true

  normal_alert:
    alias: "Send Normal Alert (L2-L3)"
    description: >
      Standard push. Respects Do Not Disturb — will not wake anyone. Used for
      L2 (with a 7am re-notify) and L3.
    mode: parallel
    max: 10
    fields:
      title: {description: Notification title}
      message: {description: Notification body}
      tag: {description: Collapse key}
      ack_action: {description: Action id fired when Acknowledge is tapped}
    sequence:
      - service: notify.mobile_app_matt_drazba_s_iphone
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            tag: "{{ tag }}"
            actions:
              - action: "{{ ack_action }}"
                title: "Acknowledge"

# ===========================================================================
# Automations
# ===========================================================================
automation:
  # -------------------------------------------------------------------------
  # Booster dry run — kill first, then classify by whether the kill worked.
  #
  # The switch is turned off before anything else. The damage window is
  # minutes; the notification is not what saves the pump.
  #
  # The kill goes to a TUYA CLOUD switch, so it is a round trip that can be
  # slow, fail outright, or be overridden by a schedule still living in the
  # Tuya app. That is why the off command is verified rather than assumed:
  #
  #   kill confirmed   -> L2. Damage stopped. Find out why in the morning.
  #   kill unconfirmed -> L1. Still being destroyed, HA is out of options,
  #                       only a human at the breaker can stop it.
  #
  # NOTE: this is the watts-based interim version, using only hardware already
  # installed. The flow-gated interlock in docs/pool_booster_interlock.md
  # supersedes it once the DN50 flow meter is installed and calibrated.
  #
  # NOTE: only fully effective once the sweep schedule is DELETED from the
  # Tuya app. Until then Tuya can re-command the switch on while HA is down.
  # -------------------------------------------------------------------------
  - id: jeeves_booster_dry_run_kill
    alias: "Pool: booster dry-run kill"
    description: >
      Booster on while the main pump draws under 20 W. Kills the switch, then
      verifies. Confirmed kill is L2; unconfirmed kill escalates to L1.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.pool_booster_dry_run
        to: "on"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.pool_sweep_socket_1

      # Give the Tuya cloud round trip time to land, then retry once before
      # concluding that HA cannot stop this.
      - delay: "00:00:20"
      - if:
          - condition: state
            entity_id: switch.pool_sweep_socket_1
            state: "on"
        then:
          - service: switch.turn_off
            target:
              entity_id: switch.pool_sweep_socket_1
          - delay: "00:00:15"

      - choose:
          # ---------------------------------------------------------------
          # L1 — the kill did not take. Pump is still being destroyed.
          # ---------------------------------------------------------------
          - conditions:
              - condition: state
                entity_id: switch.pool_sweep_socket_1
                state: "on"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.alert_open_booster_kill_failed
              - repeat:
                  sequence:
                    - service: script.critical_alert
                      data:
                        title: "POOL BOOSTER RUNNING DRY"
                        message: >
                          Could not switch the sweep off — Tuya did not respond.
                          The booster is running without water and will destroy
                          its seal within minutes. GO KILL THE BREAKER FOR THE
                          SWEEP CIRCUIT NOW.
                        tag: "pool-booster-kill-failed"
                        ack_action: "ACK_BOOSTER_KILL_FAILED"
                    - delay: "00:05:00"
                  while:
                    - condition: state
                      entity_id: input_boolean.alert_open_booster_kill_failed
                      state: "on"
                    - condition: template
                      value_template: "{{ repeat.index < 24 }}"

        # -----------------------------------------------------------------
        # L2 — kill confirmed. Damage stopped; diagnosis can wait for morning.
        # -----------------------------------------------------------------
        default:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.alert_open_booster_dry_run
          - condition: state
            entity_id: input_boolean.pool_maintenance
            state: "off"
          - service: script.normal_alert
            data:
              title: "Pool sweep shut off — booster was running dry"
              message: >
                The booster was on with the main pump at
                {{ states('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
                }} W. Sweep switched off and confirmed. The pump is safe. Check
                why the main pump was not running before sweeping again.
              tag: "pool-booster-dry-run"
              ack_action: "ACK_BOOSTER_DRY_RUN"

  # -------------------------------------------------------------------------
  # L2 — main pump off during its run window. Nothing automatic can restart a
  # tripped breaker, but the pool tolerates a night unfiltered. Sleep is fine.
  # -------------------------------------------------------------------------
  - id: jeeves_pump_unexpectedly_off
    alias: "Pool: main pump unexpectedly off"
    description: >
      Pump drawing under 20 W for 15 minutes inside its 9pm-4pm run window.
      Normal push now, re-raised at 7am until acknowledged.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.pool_pump_unexpectedly_off
        to: "on"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.alert_open_pump_off
      - service: script.normal_alert
        data:
          title: "Pool pump is off"
          message: >
            Main pump has been drawing under 20 W for 15 minutes during its
            scheduled run window. No filtration and no heat recovery.
          tag: "pool-pump-off"
          ack_action: "ACK_PUMP_OFF"

  # -------------------------------------------------------------------------
  # The L2 delivery mechanism. "In the morning" means the alert survives the
  # night without waking anyone and is still in front of you at breakfast —
  # that is a re-notification, not a louder notification.
  # -------------------------------------------------------------------------
  - id: jeeves_l2_morning_renotify
    alias: "Alerts: 7am re-raise of unacknowledged L2"
    description: Re-sends every L2 alert still open at 7am.
    mode: single
    trigger:
      - platform: time
        at: "07:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.pool_maintenance
        state: "off"
    action:
      - if:
          - condition: state
            entity_id: input_boolean.alert_open_pump_off
            state: "on"
        then:
          - service: script.normal_alert
            data:
              title: "Still open: pool pump was off"
              message: >
                The main pump alert from overnight has not been acknowledged.
                Current draw:
                {{ states('sensor.shellyemg3_dcb4d9ce63a4_energy_meter_0_power')
                }} W.
              tag: "pool-pump-off"
              ack_action: "ACK_PUMP_OFF"

      - if:
          - condition: state
            entity_id: input_boolean.alert_open_booster_dry_run
            state: "on"
        then:
          - service: script.normal_alert
            data:
              title: "Still open: sweep was shut off"
              message: >
                The booster dry-run alert has not been acknowledged. Check why
                the main pump was not running before sweeping again.
              tag: "pool-booster-dry-run"
              ack_action: "ACK_BOOSTER_DRY_RUN"

  # -------------------------------------------------------------------------
  # Acknowledge buttons. trigger.id is the suffix of the matching flag, so one
  # automation serves every alert.
  # -------------------------------------------------------------------------
  - id: jeeves_alert_acknowledged
    alias: "Alerts: acknowledge button tapped"
    mode: parallel
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ACK_PUMP_OFF"
        id: pump_off
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ACK_BOOSTER_DRY_RUN"
        id: booster_dry_run
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "ACK_BOOSTER_KILL_FAILED"
        id: booster_kill_failed
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: "input_boolean.alert_open_{{ trigger.id }}"

  # =========================================================================
  # SWEEP SCHEDULE — HA runs 9:45pm - 11:15pm, deliberately OFFSET INSIDE the
  # Tuya app's existing 10:00pm - 11:30pm window.
  #
  # The overlap is the point, and it does two jobs at once:
  #
  #   1. TUYA BECOMES A BACKUP. If HA is down, Tuya still starts the sweep at
  #      10:00 and stops it at 11:30. Nothing is lost during the trial period.
  #   2. IT MAKES THE TEST OBSERVABLE. Sweep comes on at 9:45 -> HA did it.
  #      Comes on at 10:00 -> HA failed and Tuya covered. Otherwise there is no
  #      way to tell which system acted.
  #
  # The commands are idempotent, so the two schedules cannot fight: Tuya's
  # 10:00 "on" lands on an already-on switch, and its 11:30 "off" lands on an
  # already-off one.
  #
  # ONCE OBSERVED WORKING, DELETE THE TUYA SCHEDULE. That deletion is the step
  # that makes the dry-run interlock actually safe — the Tuya switch becomes a
  # dumb relay that only ever acts on HA's command, so every failure (HA down,
  # network down, Tuya cloud down) degrades to "the booster never runs."
  # Dirty pool, healthy pump. While the Tuya schedule still exists, Tuya can
  # start the booster by itself with no idea whether the main pump is running.
  #
  # Manual rules being satisfied (PB4-60 install manual):
  #   "start at least half an hour AFTER the filtration pump"  -> pump starts
  #     9pm, sweep 9:45pm (45 min), and the >=30 min condition is enforced
  #     against measured pump draw rather than assumed from the clock
  #   "stop at least half an hour BEFORE the filtration pump"  -> pump runs to
  #     4pm, leaving 16.75 h of margin
  #
  # INTERIM: gates on pump WATTS, not flow — same limitation as the dry-run
  # kill. Watts prove the pump is energized, not that it is moving enough
  # water. The DN50 flow meter replaces this condition.
  # =========================================================================
  - id: jeeves_sweep_schedule_on
    alias: "Pool: sweep schedule on"
    description: >
      Starts the Polaris at 9:45pm, but only if the main pump has genuinely
      been running for 30 minutes. If it has not, the sweep is skipped rather
      than started against an unproven pump — and Tuya's 10:00pm schedule is
      the backup during the trial period.
    mode: single
    trigger:
      - platform: time
        at: "21:45:00"
    condition:
      - condition: state
        entity_id: binary_sensor.pool_pump_running
        state: "on"
        for: "00:30:00"
      - condition: state
        entity_id: input_boolean.pool_maintenance
        state: "off"
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.pool_sweep_socket_1

  - id: jeeves_sweep_schedule_off
    alias: "Pool: sweep schedule off"
    description: Ends the sweep window. Unconditional — always turns off.
    mode: single
    trigger:
      - platform: time
        at: "23:15:00"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.pool_sweep_socket_1

  # -------------------------------------------------------------------------
  # Backstop for the case where HA is down at 11:15pm and misses the off
  # trigger entirely. Without this the sweep would run until the main pump
  # stops at 4pm — not damaging, since there is water, but hours of needless
  # wear and ~1.5 kW of billing.
  #
  # The guard window is widened to Tuya's 11:30pm rather than HA's 11:15pm, so
  # that during the overlap period it does not fight a sweep that Tuya legitimately
  # started. Once the Tuya schedule is deleted, tighten this back to 23:15.
  #
  # Skipped while maintenance mode is on, so the sweep can be run manually at
  # any hour without this turning it off 15 minutes later.
  # -------------------------------------------------------------------------
  - id: jeeves_sweep_outside_window_guard
    alias: "Pool: sweep running outside its window"
    description: Turns the sweep off if it is on outside 9:45-11:30pm.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: state
        entity_id: switch.pool_sweep_socket_1
        state: "on"
      - condition: state
        entity_id: input_boolean.pool_maintenance
        state: "off"
      - condition: template
        value_template: >
          {{ not (today_at('21:45') <= now() < today_at('23:30')) }}
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.pool_sweep_socket_1
