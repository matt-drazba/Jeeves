esphome:
  name: pool-pad
  friendly_name: Pool Pad

esp8266:
  board: nodemcuv2   # HiLetgo ESP8266 = NodeMCU v2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "pool-pad-fallback"

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# I2C bus for the ADS1115 (filter pressure ADC). GPIO4/GPIO13 freed 2026-07-28
# and 2026-08-05 respectively — see the pin assignments note below.
i2c:
  sda: GPIO4      # D2
  scl: GPIO13     # D7

ads1115:
  - address: 0x48   # default address on the ADDR-to-GND breakout wiring

# ── Pin assignments ────────────────────────────────────────────────────────
# Set before flashing. Confirm physical wiring at the pad first.
# Safe NodeMCU GPIO choices for inputs: GPIO5(D1), GPIO4(D2), GPIO14(D5), GPIO12(D6)
# Avoid boot-sensitive: GPIO0(D3), GPIO2(D4), GPIO15(D8)
# One-wire needs external 4.7k pull-up resistor to 3.3V.
substitutions:
  pin_relay_heat_active: GPIO5    # D1 — relay ch1: heater trio 24VAC (after flow switch)
  pin_one_wire:          GPIO14   # D5 — DS18B20 one-wire bus (4.7k pull-up to 3.3V required)
  pin_flow_pulse:        GPIO12   # D6 — hall-effect flow sensor pulse
  # pin_boost_relay:     GPIO13   # D7 — dropped 2026-08-05, see note at end of file
  # GPIO4 (D2) freed — was FPH pump-call sensor, dropped 2026-07-28 (see docs/pool_heat_recovery.md)

  # Probe zero-offset, °F, added to the HX outlet reading.
  #
  # ⚠ STATUS: 0.0 today, and that DISARMS the heat-exchanger alert.
  # binary_sensor.pool_hx_not_transferring fires on ΔT <= 0. Measured live
  # 2026-08-10 with this offset genuinely at zero, pump running and heat off,
  # the outlet reads +0.3 to +0.4°F ABOVE the inlet — so a heat exchanger that
  # has completely stopped transferring still reads positive and can never
  # trip the alert. Full write-up: docs/pool_probe_calibration.md (status OPEN).
  #
  # This is NOT a fault. DS18B20 is ±0.5°C absolute, so two of them may legally
  # differ by up to 1.8°F. 0.3°F is well inside tolerance and simply has to be
  # calibrated out.
  #
  # A previous version of this comment claimed the raw probes "already agree to
  # within one LSB" from 102 samples on 2026-08-08. That conclusion was WRONG
  # and is retracted: it inferred raw agreement by SUBTRACTING an offset it
  # assumed was live on the device, rather than measuring with the offset
  # actually set to zero. Corrected 2026-08-10 by reflashing and confirming.
  #
  # DO NOT simply set this to "-0.3". Shield the probes FIRST — shielding
  # changes the offset, so calibrating now bakes in a bias you are about to
  # remove. The outlet probe is very likely in direct sun: with the pump OFF
  # the legs decouple to +5.51°F (2026-08-08 16:58, heat recovery off), while
  # with the pump ON they track within ~0.3°F all day. Insulate and jacket BOTH
  # legs identically — ΔT is a difference, so a symmetric load cancels; never a
  # towel, wet fabric is an evaporative cooler. Then take the three-point
  # measurement in docs/pool_probe_calibration.md and move the alert threshold
  # to about -0.15°F so quantization noise cannot trip it.
  out_temp_offset_f: "0.0"

# ── Relay dry-contact input ───────────────────────────────────────────────
# Switched from an opto module to a White Rodgers Type 84 fan relay (24VAC
# coil, SPNO contact, 90-290Q): coil taps the 24VAC pair in parallel
# (non-invasive), contact closes 3.3V to the GPIO when the coil is energized.
# Requires an external 10k pulldown resistor to GND — ESP8266 has no internal
# pulldown option except on GPIO16, so this reads HIGH (active) when closed
# and needs the resistor to read a clean LOW (idle) when open.
# Relay: across trio 24VAC AFTER the Tecmark flow switch — true pool heat active state.
binary_sensor:
  - platform: gpio
    pin:
      number: ${pin_relay_heat_active}
      mode: INPUT
    name: "Pool Heat Active"
    id: pool_heat_active
    device_class: running
    filters:
      - delayed_on: 2s
      - delayed_off: 2s

# ── DS18B20 temperature probes ────────────────────────────────────────────
# Addresses confirmed via boot-scan log 2026-07-27. in/out assignment below
# is a guess (first/second found) — verify by warming one probe and checking
# which entity moves in HA; swap the two address values if backwards.
# Probe placement: in_temp = HX inlet well, out_temp = HX outlet well.
# Pool return probe deferred — add a third dallas_temp block here later if wired.
one_wire:
  - platform: gpio
    pin: ${pin_one_wire}
    id: ow_bus

sensor:
  - platform: dallas_temp
    address: 0xe40b244456303128
    name: "HX Water In Temp"
    id: hx_water_in_temp
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: return x * 9.0/5.0 + 32.0;
      - filter_out: nan

  # Zero-offset calibration: with the pump RUNNING and heat OFF, both probes see
  # the same water, so any steady difference is probe tolerance (DS18B20 is
  # ±0.5°C / ±0.9°F absolute), not real heat loss. Inlet is the reference; the
  # outlet is trimmed to match it. Offset is applied AFTER the °C→°F lambda,
  # so it is in °F. Re-measure if a probe is ever replaced or re-seated.
  - platform: dallas_temp
    address: 0x110b244453050b28
    name: "HX Water Out Temp"
    id: hx_water_out_temp
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: return x * 9.0/5.0 + 32.0;
      - offset: ${out_temp_offset_f}
      - filter_out: nan

  # ── Flow sensor ──────────────────────────────────────────────────────────
  # Measure pipe diameter before ordering sensor (1.5" vs 2" — different K-factors).
  # Calibration: run pump at 2200 RPM, compare reading to Blue-White gauge, adjust multiply.
  # pulse_counter reports pulses/min; multiply converts to GPM using sensor K-factor.
  - platform: pulse_counter
    pin:
      number: ${pin_flow_pulse}
      mode: INPUT_PULLUP
    name: "Pool Flow GPM"
    id: pool_flow_gpm
    unit_of_measurement: "GPM"
    accuracy_decimals: 1
    update_interval: 10s
    filters:
      # Theoretical, from DN50 sensor datasheet: 12 pulses/liter, 1L=0.2642gal.
      # GPM = pulses/min ÷ 12 × 0.2642 = pulses/min × 0.02201
      # Confirm via sequential calibration (Blue-White gauge, then this sensor,
      # both at the SAME Ext. Program 4 speed — 2200 RPM today, but that is an
      # adjustable setting on the pump pad (up to 3450), not a lock. Hold it
      # unchanged across both readings. Can't install both in the run at once.
      - multiply: 0.02201   # theoretical — verify against Blue-White at the Program 4 speed

  # ── Heat recovery BTU/hr ─────────────────────────────────────────────────
  # Standard pool formula: GPM × ΔT(°F) × 500 = BTU/hr
  # Only computed when heat diversion is active (flow switch closed + trio energized).
  - platform: template
    name: "Pool Heat BTU⁄hr"
    id: pool_heat_btu_hr
    unit_of_measurement: "BTU/hr"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (id(pool_heat_active).state) {
        float dt = id(hx_water_out_temp).state - id(hx_water_in_temp).state;
        float gpm = id(pool_flow_gpm).state;
        if (!isnan(dt) && !isnan(gpm) && gpm > 0.0f) {
          return gpm * dt * 500.0f;
        }
      }
      return 0.0f;

  # ── Filter pressure ────────────────────────────────────────────────────
  # ADS1115 on A0 only — no rail-compensation channel, evaluated and skipped
  # 2026-08-28 (calibration against the analog gauge below covers the small
  # offset/scale error that would introduce). Divider actually built is
  # 2.2k + 4.7k (ratio 0.681), not the originally spec'd 4.7k + 10k (0.680) —
  # nearly identical, see docs/pool_pressure_install_card.md.
  - platform: ads1115
    multiplexer: A0_GND
    gain: 4.096
    id: press_adc
    update_interval: 10s
    internal: true
    filters:
      - median: {window_size: 5, send_every: 5}

  - platform: template
    name: "Filter Pressure"
    id: filter_pressure
    unit_of_measurement: "PSI"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      float a0 = id(press_adc).state;
      if (isnan(a0)) return NAN;
      float v = a0 / 0.681f;            // undo the input divider (2.2k/4.7k built)
      return (v - 0.5f) * 15.0f;        // 60 psi FS: FS / 4.0V
    filters:
      # Two-point calibration against the analog gauge, 2026-08-28:
      # pump off -> gauge 0 psi, raw read 1.3; pump on -> gauge 7.9 psi, raw read 10.9.
      - calibrate_linear:
          - 1.3 -> 0.0
          - 10.9 -> 7.9

# ── Pump control relay — DROPPED 2026-08-05, not built ───────────────────
# Briefly designed as ESP relay → IntelliComm II input 2 → Ext. Program 2, to
# give HA remote start/stop of the main pump. Dropped: the motivating problem
# (pump running unattended at the wrong time) turned out to be a booster-pump
# dry-run risk, which is solved entirely in HA + the flow meter with no main
# pump control at all. See docs/pool_booster_interlock.md.
#
# GPIO13 (D7) is free TODAY, but docs/pool_data_addendum.md claims both GPIO13
# and GPIO4 as the I2C bus for the planned ADS1115 filter-pressure ADC. If that
# lands first, use GPIO16 (D0) for this relay instead: it is output-capable and
# idles LOW, which is exactly the polarity required below. It is absent from the
# pin list at the top of this file only because that list is for INPUTS —
# GPIO16 has no interrupt and no pull-up, neither of which a relay drive needs.
#
# Findings kept here in case this is ever revisited:
#
# - IntelliComm inputs are VOLTAGE-DRIVEN (9-24V AC/DC), not dry-contact. The
#   relay must switch a real source — a series switch in a live leg, not a bare
#   contact across the input terminals.
# - SOURCE IT FROM THE 12V ADAPTER in the chimney box, the one already feeding
#   the IntelliComm and the ESP's buck converter. 12V is inside the 9-24V input
#   spec. docs/pool_wiring_manual.md 5.2 used to say "switch 24VAC onto the
#   input ... from the same transformer pair" — both are electrically legal, but
#   the only 24VAC here is the FPH trio leg, i.e. the flow-switch-gated safety
#   circuit. Do not hang a discretionary HA pump command off the safety chain
#   when an independent supply is already in the box. Reconciled 2026-08-13.
# - Use input 2, never 4. FPH heat recovery owns input 4 and higher input
#   number wins, so nothing commanded here could interrupt a live diversion.
# - An IntelliComm input can only START a program. Releasing it stops the pump
#   only if the pump has no onboard schedule telling it to run. A true remote
#   OFF therefore requires retiring the pump's onboard schedule entirely.
# - Buy an ACTIVE-HIGH relay module. Most cheap opto-isolated boards are
#   active-LOW, and GPIO13 idles LOW through boot and reset — an active-low
#   board would start the pump on every ESP reboot.
# - Any such switch needs a local watchdog auto-off, so a WiFi drop after an
#   on-command can't leave the pump running indefinitely.
