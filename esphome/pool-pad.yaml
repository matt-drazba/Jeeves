esphome:
  name: pool-pad
  friendly_name: Pool Pad

esp8266:
  board: nodemcuv2   # HiLetgo ESP8266 = NodeMCU v2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "pool-pad-fallback"

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# ── Pin assignments ────────────────────────────────────────────────────────
# Set before flashing. Confirm physical wiring at the pad first.
# Safe NodeMCU GPIO choices for inputs: GPIO5(D1), GPIO4(D2), GPIO14(D5), GPIO12(D6)
# Avoid boot-sensitive: GPIO0(D3), GPIO2(D4), GPIO15(D8)
# One-wire needs external 4.7k pull-up resistor to 3.3V.
substitutions:
  pin_relay_heat_active: GPIO5    # D1 — relay ch1: heater trio 24VAC (after flow switch)
  pin_one_wire:          GPIO14   # D5 — DS18B20 one-wire bus (4.7k pull-up to 3.3V required)
  pin_flow_pulse:        GPIO12   # D6 — hall-effect flow sensor pulse
  # pin_boost_relay:     GPIO13   # D7 — phase 2: relay → IntelliComm input 2
  # GPIO4 (D2) freed — was FPH pump-call sensor, dropped 2026-07-28 (see docs/pool_heat_recovery.md)

  # Probe zero-offset, °F, added to the HX outlet reading. Measured with the
  # pump running and no heat: outlet read 0.4°F below inlet, so add 0.4 back.
  out_temp_offset_f: "0.4"

# ── Relay dry-contact input ───────────────────────────────────────────────
# Switched from an opto module to a White Rodgers Type 84 fan relay (24VAC
# coil, SPNO contact, 90-290Q): coil taps the 24VAC pair in parallel
# (non-invasive), contact closes 3.3V to the GPIO when the coil is energized.
# Requires an external 10k pulldown resistor to GND — ESP8266 has no internal
# pulldown option except on GPIO16, so this reads HIGH (active) when closed
# and needs the resistor to read a clean LOW (idle) when open.
# Relay: across trio 24VAC AFTER the Tecmark flow switch — true pool heat active state.
binary_sensor:
  - platform: gpio
    pin:
      number: ${pin_relay_heat_active}
      mode: INPUT
    name: "Pool Heat Active"
    id: pool_heat_active
    device_class: running
    filters:
      - delayed_on: 2s
      - delayed_off: 2s

# ── DS18B20 temperature probes ────────────────────────────────────────────
# Addresses confirmed via boot-scan log 2026-07-27. in/out assignment below
# is a guess (first/second found) — verify by warming one probe and checking
# which entity moves in HA; swap the two address values if backwards.
# Probe placement: in_temp = HX inlet well, out_temp = HX outlet well.
# Pool return probe deferred — add a third dallas_temp block here later if wired.
one_wire:
  - platform: gpio
    pin: ${pin_one_wire}
    id: ow_bus

sensor:
  - platform: dallas_temp
    address: 0xe40b244456303128
    name: "HX Water In Temp"
    id: hx_water_in_temp
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: return x * 9.0/5.0 + 32.0;
      - filter_out: nan

  # Zero-offset calibration: with the pump RUNNING and heat OFF, both probes see
  # the same water, so any steady difference is probe tolerance (DS18B20 is
  # ±0.5°C / ±0.9°F absolute), not real heat loss. Inlet is the reference; the
  # outlet is trimmed to match it. Offset is applied AFTER the °C→°F lambda,
  # so it is in °F. Re-measure if a probe is ever replaced or re-seated.
  - platform: dallas_temp
    address: 0x110b244453050b28
    name: "HX Water Out Temp"
    id: hx_water_out_temp
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: return x * 9.0/5.0 + 32.0;
      - offset: ${out_temp_offset_f}
      - filter_out: nan

  # ── Flow sensor ──────────────────────────────────────────────────────────
  # Measure pipe diameter before ordering sensor (1.5" vs 2" — different K-factors).
  # Calibration: run pump at 2200 RPM, compare reading to Blue-White gauge, adjust multiply.
  # pulse_counter reports pulses/min; multiply converts to GPM using sensor K-factor.
  - platform: pulse_counter
    pin:
      number: ${pin_flow_pulse}
      mode: INPUT_PULLUP
    name: "Pool Flow GPM"
    id: pool_flow_gpm
    unit_of_measurement: "GPM"
    accuracy_decimals: 1
    update_interval: 10s
    filters:
      # Theoretical, from DN50 sensor datasheet: 12 pulses/liter, 1L=0.2642gal.
      # GPM = pulses/min ÷ 12 × 0.2642 = pulses/min × 0.02201
      # Confirm via sequential calibration (Blue-White gauge, then this sensor,
      # both at locked 2200 RPM — can't install both in the run at once).
      - multiply: 0.02201   # theoretical — verify against Blue-White at 2200 RPM

  # ── Heat recovery BTU/hr ─────────────────────────────────────────────────
  # Standard pool formula: GPM × ΔT(°F) × 500 = BTU/hr
  # Only computed when heat diversion is active (flow switch closed + trio energized).
  - platform: template
    name: "Pool Heat BTU⁄hr"
    id: pool_heat_btu_hr
    unit_of_measurement: "BTU/hr"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (id(pool_heat_active).state) {
        float dt = id(hx_water_out_temp).state - id(hx_water_in_temp).state;
        float gpm = id(pool_flow_gpm).state;
        if (!isnan(dt) && !isnan(gpm) && gpm > 0.0f) {
          return gpm * dt * 500.0f;
        }
      }
      return 0.0f;

# ── Phase 2: pump-boost relay ────────────────────────────────────────────
# Uncomment when wired: ESP relay → IntelliComm input 2 → pump Ext. Program 2.
# Lower priority than FPH (input 4 wins). For pre-swim and HA automations.
# switch:
#   - platform: gpio
#     pin: ${pin_boost_relay}
#     name: "Pool Pump Boost"
#     id: pool_pump_boost
#     icon: mdi:pump
#     restore_mode: ALWAYS_OFF
