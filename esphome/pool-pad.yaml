esphome:
  name: pool-pad
  friendly_name: Pool Pad

esp8266:
  board: nodemcuv2   # HiLetgo ESP8266 = NodeMCU v2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "pool-pad-fallback"

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# ── Pin assignments ────────────────────────────────────────────────────────
# Set before flashing. Confirm physical wiring at the pad first.
# Safe NodeMCU GPIO choices for inputs: GPIO5(D1), GPIO4(D2), GPIO14(D5), GPIO12(D6)
# Avoid boot-sensitive: GPIO0(D3), GPIO2(D4), GPIO15(D8)
# One-wire needs external 4.7k pull-up resistor to 3.3V.
substitutions:
  pin_relay_heat_active: GPIO5    # D1 — relay ch1: heater trio 24VAC (after flow switch)
  pin_one_wire:          GPIO14   # D5 — DS18B20 one-wire bus (4.7k pull-up to 3.3V required)
  pin_flow_pulse:        GPIO12   # D6 — hall-effect flow sensor pulse
  # pin_boost_relay:     GPIO13   # D7 — dropped 2026-08-05, see note at end of file
  # GPIO4 (D2) freed — was FPH pump-call sensor, dropped 2026-07-28 (see docs/pool_heat_recovery.md)

  # Probe zero-offset, °F, added to the HX outlet reading.
  #
  # ZEROED 2026-08-08 against 102 logged samples, all pump-running / heat-off,
  # which is exactly the zero-delta condition this is meant to calibrate. With
  # +0.3 applied the measured delta was a median +0.3 (range 0.19-0.53, i.e.
  # 0.11°F quantization steps either side). Subtracting the offset back out puts
  # the raw probes at a median 0.0 apart — they already agree to within one LSB.
  #
  # The old 0.3 came from a 2026-08-05 spot reading of "outlet 0.3-0.5°F below
  # inlet." That no longer reproduces; a single reading at the resolution floor
  # was too thin a basis, and the probes have been reseated since.
  #
  # This was not cosmetic. binary_sensor.pool_hx_not_transferring fires on
  # ΔT <= 0, so a permanent +0.3 meant a heat exchanger that had genuinely
  # stopped transferring would still read positive and never alert. It would
  # also have injected phantom heat into BTU/hr (GPM x ΔT x 500 — about 8,000
  # BTU/hr of fiction at 55 GPM) the day the flow meter goes in.
  #
  # Still only ~3.5 hours of data across a narrow 79.1-79.6°F band. Re-check
  # across a wider water-temp range; if the gap tracks temperature rather than
  # staying flat, replace this with a calibrate_linear two-point fit.
  out_temp_offset_f: "0.0"

# ── Relay dry-contact input ───────────────────────────────────────────────
# Switched from an opto module to a White Rodgers Type 84 fan relay (24VAC
# coil, SPNO contact, 90-290Q): coil taps the 24VAC pair in parallel
# (non-invasive), contact closes 3.3V to the GPIO when the coil is energized.
# Requires an external 10k pulldown resistor to GND — ESP8266 has no internal
# pulldown option except on GPIO16, so this reads HIGH (active) when closed
# and needs the resistor to read a clean LOW (idle) when open.
# Relay: across trio 24VAC AFTER the Tecmark flow switch — true pool heat active state.
binary_sensor:
  - platform: gpio
    pin:
      number: ${pin_relay_heat_active}
      mode: INPUT
    name: "Pool Heat Active"
    id: pool_heat_active
    device_class: running
    filters:
      - delayed_on: 2s
      - delayed_off: 2s

# ── DS18B20 temperature probes ────────────────────────────────────────────
# Addresses confirmed via boot-scan log 2026-07-27. in/out assignment below
# is a guess (first/second found) — verify by warming one probe and checking
# which entity moves in HA; swap the two address values if backwards.
# Probe placement: in_temp = HX inlet well, out_temp = HX outlet well.
# Pool return probe deferred — add a third dallas_temp block here later if wired.
one_wire:
  - platform: gpio
    pin: ${pin_one_wire}
    id: ow_bus

sensor:
  - platform: dallas_temp
    address: 0xe40b244456303128
    name: "HX Water In Temp"
    id: hx_water_in_temp
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: return x * 9.0/5.0 + 32.0;
      - filter_out: nan

  # Zero-offset calibration: with the pump RUNNING and heat OFF, both probes see
  # the same water, so any steady difference is probe tolerance (DS18B20 is
  # ±0.5°C / ±0.9°F absolute), not real heat loss. Inlet is the reference; the
  # outlet is trimmed to match it. Offset is applied AFTER the °C→°F lambda,
  # so it is in °F. Re-measure if a probe is ever replaced or re-seated.
  - platform: dallas_temp
    address: 0x110b244453050b28
    name: "HX Water Out Temp"
    id: hx_water_out_temp
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: return x * 9.0/5.0 + 32.0;
      - offset: ${out_temp_offset_f}
      - filter_out: nan

  # ── Flow sensor ──────────────────────────────────────────────────────────
  # Measure pipe diameter before ordering sensor (1.5" vs 2" — different K-factors).
  # Calibration: run pump at 2200 RPM, compare reading to Blue-White gauge, adjust multiply.
  # pulse_counter reports pulses/min; multiply converts to GPM using sensor K-factor.
  - platform: pulse_counter
    pin:
      number: ${pin_flow_pulse}
      mode: INPUT_PULLUP
    name: "Pool Flow GPM"
    id: pool_flow_gpm
    unit_of_measurement: "GPM"
    accuracy_decimals: 1
    update_interval: 10s
    filters:
      # Theoretical, from DN50 sensor datasheet: 12 pulses/liter, 1L=0.2642gal.
      # GPM = pulses/min ÷ 12 × 0.2642 = pulses/min × 0.02201
      # Confirm via sequential calibration (Blue-White gauge, then this sensor,
      # both at the SAME Ext. Program 4 speed — 2200 RPM today, but that is an
      # adjustable setting on the pump pad (up to 3450), not a lock. Hold it
      # unchanged across both readings. Can't install both in the run at once.
      - multiply: 0.02201   # theoretical — verify against Blue-White at the Program 4 speed

  # ── Heat recovery BTU/hr ─────────────────────────────────────────────────
  # Standard pool formula: GPM × ΔT(°F) × 500 = BTU/hr
  # Only computed when heat diversion is active (flow switch closed + trio energized).
  - platform: template
    name: "Pool Heat BTU⁄hr"
    id: pool_heat_btu_hr
    unit_of_measurement: "BTU/hr"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (id(pool_heat_active).state) {
        float dt = id(hx_water_out_temp).state - id(hx_water_in_temp).state;
        float gpm = id(pool_flow_gpm).state;
        if (!isnan(dt) && !isnan(gpm) && gpm > 0.0f) {
          return gpm * dt * 500.0f;
        }
      }
      return 0.0f;

# ── Pump control relay — DROPPED 2026-08-05, not built ───────────────────
# Briefly designed as ESP relay → IntelliComm II input 2 → Ext. Program 2, to
# give HA remote start/stop of the main pump. Dropped: the motivating problem
# (pump running unattended at the wrong time) turned out to be a booster-pump
# dry-run risk, which is solved entirely in HA + the flow meter with no main
# pump control at all. See docs/pool_booster_interlock.md.
#
# GPIO13 (D7) is free. Findings kept here in case this is ever revisited:
#
# - IntelliComm inputs are VOLTAGE-DRIVEN (9-24V AC/DC), not dry-contact. The
#   relay must switch a real source — a series switch in a 12V+ leg from the
#   pad adapter, not a bare contact across the input terminals.
# - Use input 2, never 4. FPH heat recovery owns input 4 and higher input
#   number wins, so nothing commanded here could interrupt a live diversion.
# - An IntelliComm input can only START a program. Releasing it stops the pump
#   only if the pump has no onboard schedule telling it to run. A true remote
#   OFF therefore requires retiring the pump's onboard schedule entirely.
# - Buy an ACTIVE-HIGH relay module. Most cheap opto-isolated boards are
#   active-LOW, and GPIO13 idles LOW through boot and reset — an active-low
#   board would start the pump on every ESP reboot.
# - Any such switch needs a local watchdog auto-off, so a WiFi drop after an
#   on-command can't leave the pump running indefinitely.
